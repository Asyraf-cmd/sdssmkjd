<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistem Demerit Murid</title>
<!--
  =====================================================================
   SISTEM DEMERIT MURID — FRONTEND · Versi 2
   GitHub Pages: simpan sebagai index.html bersama manifest.json,
   sw.js, icon-192.png dan icon-512.png dalam folder yang sama.
  =====================================================================
-->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1d4d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Demerit">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" id="favicon" href="icon-192.png">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style id="app-css">
:root{
--navy:#0b1d4d;--pri:#1d3f94;--pri2:#2a5bd7;--pri3:#5b84f1;--red:#e3222b;--yel:#f7c600;
--txt:#0f1d3d;--mut:#5b6b8c;--line:rgba(29,63,148,.10);
--glass:rgba(255,255,255,.68);--glass-hi:rgba(255,255,255,.86);--glass-bd:rgba(255,255,255,.75);
--ringan:#16a34a;--sederhana:#ea7a0c;--berat:#e3222b;--r:18px;
--sh:0 12px 32px rgba(11,29,77,.10),0 2px 6px rgba(11,29,77,.06);
--blur:blur(20px) saturate(170%);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--txt);font-size:15px;min-height:100vh;background:#e8eefc;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(900px 620px at -5% -10%,rgba(42,91,215,.42),transparent 60%),
 radial-gradient(640px 480px at 105% 5%,rgba(227,34,43,.14),transparent 62%),
 radial-gradient(760px 560px at 90% 105%,rgba(247,198,0,.18),transparent 60%),
 radial-gradient(900px 700px at 5% 105%,rgba(29,63,148,.32),transparent 60%),
 linear-gradient(160deg,#eef3ff 0%,#dde7fb 55%,#e9effd 100%)}
.hidden{display:none!important}
::selection{background:rgba(42,91,215,.22)}

/* ---------- Bar atas & navigasi ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top));position:sticky;top:0;z-index:20;min-height:66px;color:#fff;
 background:linear-gradient(120deg,rgba(11,29,77,.92),rgba(29,63,148,.86));-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
 box-shadow:0 8px 24px rgba(11,29,77,.25)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--pri2) 0 60%,var(--red) 60% 82%,var(--yel) 82%)}
.topbar img{width:46px;height:46px;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.brand{flex:1;min-width:0}.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{opacity:.8;font-size:12px;letter-spacing:.3px}
.uinfo{text-align:right;font-size:12px;line-height:1.35}.uinfo b{font-size:13px;font-weight:700}
.uinfo span{opacity:.85}
.hd-jwt{display:inline-block;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;font-weight:600}
/* ---------- Halaman sambutan ---------- */
.wel{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;color:#fff;overflow:hidden;
 background:radial-gradient(700px 500px at 15% 10%,rgba(91,132,241,.55),transparent 60%),radial-gradient(520px 420px at 90% 20%,rgba(227,34,43,.32),transparent 60%),
 radial-gradient(600px 460px at 75% 95%,rgba(247,198,0,.28),transparent 60%),linear-gradient(150deg,#0b1d4d,#1d3f94 60%,#14306f);background-size:cover;background-position:center;
 animation:fade .35s ease}
.wel.out{animation:welOut .45s ease forwards}
@keyframes welOut{to{opacity:0;transform:scale(1.03)}}
.wel-box{position:relative;width:100%;max-width:520px;text-align:center;padding:34px 28px 26px;border-radius:28px;
 background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);
 border:1px solid rgba(255,255,255,.28);box-shadow:0 30px 80px rgba(5,14,40,.45);animation:pop .5s ease}
.wel-box::before{content:"";position:absolute;left:36px;right:36px;top:0;height:4px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--pri3) 0 60%,var(--red) 60% 82%,var(--yel) 82%)}
.wel-box img{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35))}
.wel-salam{margin:14px 0 2px;font-size:15px;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.9}
.wel-salam span{display:inline-block;font-size:22px;vertical-align:-3px;margin-right:6px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px)}}
.wel-nama{font-size:28px;font-weight:800;line-height:1.2;margin:4px 0 10px;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.wel-jwt{display:inline-block;padding:6px 16px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--pri);font-weight:800;font-size:13.5px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.wel-sek{margin-top:14px;font-size:13px;opacity:.85;font-weight:600}
.wel-masa{margin-top:16px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.wel-masa div{padding:8px 14px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);font-size:13px}
.wel-masa b{font-size:18px;letter-spacing:1px}
.wel-info{margin-top:12px;font-size:12.5px;opacity:.9}
.wel-info span{display:inline-block;margin:3px 4px;padding:4px 10px;border-radius:999px;background:rgba(227,34,43,.35);border:1px solid rgba(255,255,255,.25)}
.wel-btn{margin-top:22px;width:100%;justify-content:center;padding:13px 18px;font-size:15px;background:#fff!important;color:var(--pri)!important;box-shadow:0 10px 26px rgba(0,0,0,.25)!important}
.wel-btn:focus{outline:none}.wel-btn:focus-visible{outline:3px solid rgba(255,255,255,.55);outline-offset:3px}
.wel-bar{margin-top:20px;height:3px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.wel-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--yel),#fff);transform-origin:left;animation:welBar 4s linear forwards}
@keyframes welBar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media(max-width:600px){.wel-nama{font-size:23px}.wel-box{padding:28px 20px 22px}}
.uinfo button,.instbtn{margin-top:4px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px 12px;cursor:pointer;font:inherit;font-size:12px;font-weight:600;transition:background .2s}
.uinfo button:hover,.instbtn:hover{background:rgba(255,255,255,.26)}
nav{display:flex;gap:4px;overflow-x:auto;padding:6px 10px calc(6px + env(safe-area-inset-bottom));position:fixed;left:0;right:0;bottom:0;z-index:30;scrollbar-width:none;justify-content:safe center;
 background:rgba(255,255,255,.72);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-top:1px solid var(--glass-bd);box-shadow:0 -8px 28px rgba(11,29,77,.12)}
nav::-webkit-scrollbar{display:none}
nav button{position:relative;flex:0 0 auto;min-width:76px;border:0;background:none;padding:7px 10px 6px;border-radius:14px;cursor:pointer;font:inherit;color:var(--mut);transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ni{font-size:20px;line-height:1.1}
nav button .nl{font-size:11px;font-weight:700;white-space:nowrap;letter-spacing:.1px}
nav button:hover{background:rgba(42,91,215,.08);color:var(--pri)}
nav button.on{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;box-shadow:0 6px 16px rgba(42,91,215,.35)}
nav button .dot{position:absolute;top:2px;right:10px;margin:0}
.dot{display:inline-block;min-width:19px;padding:0 6px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;margin-left:6px;text-align:center;line-height:18px;box-shadow:0 2px 6px rgba(227,34,43,.4)}
main{max-width:1180px;margin:0 auto;padding:20px 16px calc(100px + env(safe-area-inset-bottom))}

/* ---------- Kad kaca ---------- */
.card{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-bd);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:16px}
.card h3{margin:0 0 14px;font-size:16px;font-weight:700;color:var(--navy);letter-spacing:.1px}
.grid{display:grid;gap:14px;margin-bottom:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.g6{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.grid>.card{margin-bottom:0}
.hero{position:relative;overflow:hidden;border-radius:var(--r);padding:20px 22px;margin-bottom:16px;color:#fff;
 background:linear-gradient(125deg,var(--navy) 0%,var(--pri) 55%,var(--pri2) 100%);box-shadow:0 14px 34px rgba(29,63,148,.30)}
.hero::before{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(247,198,0,.35),transparent 65%)}
.hero::after{content:"";position:absolute;right:120px;bottom:-110px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(227,34,43,.30),transparent 65%)}
.hero h2{margin:0;font-size:20px;font-weight:800;position:relative}.hero p{margin:4px 0 0;opacity:.85;font-size:13px;position:relative}
.stat{position:relative;overflow:hidden;background:var(--glass-hi);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-bd);border-radius:16px;padding:14px 16px;box-shadow:var(--sh)}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--pri3),var(--pri))}
.stat .n{font-size:28px;font-weight:800;letter-spacing:-.5px;color:var(--navy)}
.stat .l{color:var(--mut);font-size:12.5px;font-weight:600}
.stat.ringan::before{background:linear-gradient(180deg,#4ade80,var(--ringan))}.stat.ringan .n{color:var(--ringan)}
.stat.sederhana::before{background:linear-gradient(180deg,#fdba74,var(--sederhana))}.stat.sederhana .n{color:var(--sederhana)}
.stat.berat::before{background:linear-gradient(180deg,#fb7185,var(--berat))}.stat.berat .n{color:var(--berat)}
.stat.amber::before{background:linear-gradient(180deg,#fde047,#eab308)}.stat.amber .n{color:#a16207}
.stat.click{cursor:pointer;transition:transform .2s}.stat.click:hover{transform:translateY(-2px)}

/* ---------- Borang ---------- */
label{display:block;font-size:12.5px;font-weight:700;margin:12px 0 5px;color:#30406a;letter-spacing:.2px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid rgba(29,63,148,.16);border-radius:12px;font:inherit;background:rgba(255,255,255,.88);color:inherit;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri2);box-shadow:0 0 0 4px rgba(42,91,215,.16);background:#fff}
input:disabled{background:rgba(241,245,255,.8);color:var(--mut)}
textarea{min-height:76px;resize:vertical}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--pri2)}
.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;color:#fff;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;
 background:linear-gradient(135deg,var(--pri2),var(--pri));box-shadow:0 6px 16px rgba(42,91,215,.28);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(42,91,215,.34)}
.btn:active{transform:translateY(0)}
.btn.sec{background:rgba(255,255,255,.85);color:var(--pri);border:1px solid rgba(29,63,148,.16);box-shadow:0 2px 8px rgba(11,29,77,.06)}
.btn.red{background:linear-gradient(135deg,#f0454d,var(--red));box-shadow:0 6px 16px rgba(227,34,43,.28)}
.btn.grn{background:linear-gradient(135deg,#22c55e,#15803d);box-shadow:0 6px 16px rgba(22,163,74,.26)}
.btn.amb{background:linear-gradient(135deg,#facc15,#eab308);color:#3b2f00;box-shadow:0 6px 16px rgba(234,179,8,.30)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:150px}.row>.btn{flex:0 0 auto}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

/* ---------- Jadual & lencana ---------- */
.tw{overflow-x:auto;border-radius:12px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.tbl th,.tbl td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{background:rgba(29,63,148,.06);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--pri);font-weight:700;white-space:nowrap}
.tbl th:first-child{border-top-left-radius:10px}.tbl th:last-child{border-top-right-radius:10px}
.tbl tbody tr{transition:background .15s}.tbl tbody tr:hover{background:rgba(42,91,215,.05)}
.tbl td input,.tbl td select{padding:7px 9px}
.tbl a{color:var(--pri2);font-weight:600;text-decoration:none}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;color:#fff;white-space:nowrap;letter-spacing:.2px}
.b-Ringan{background:linear-gradient(135deg,#22c55e,#16a34a)}.b-Sederhana{background:linear-gradient(135deg,#fb923c,#ea7a0c)}.b-Berat{background:linear-gradient(135deg,#f0454d,#e3222b)}
.b-none{background:#94a3b8}.b-on{background:linear-gradient(135deg,var(--pri3),var(--pri2))}.b-off{background:#94a3b8}
.b-BELUM{background:linear-gradient(135deg,#f0454d,#e3222b)}.b-PROSES{background:linear-gradient(135deg,#facc15,#eab308);color:#3b2f00}.b-SELESAI{background:linear-gradient(135deg,#22c55e,#16a34a)}
.b-arkib{background:#64748b}

/* ---------- Pemilih murid ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(42,91,215,.08);border:1px solid rgba(42,91,215,.22);border-radius:14px;padding:9px 12px;font-size:13px;display:flex;gap:10px;align-items:flex-start;max-width:100%}
.chip button{border:0;background:none;color:var(--red);font-size:20px;cursor:pointer;line-height:1;padding:0}
.pick{max-height:270px;overflow:auto;border:1px solid rgba(29,63,148,.14);border-radius:14px;margin-top:8px;background:rgba(255,255,255,.7)}
.pick div{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;transition:background .15s}
.pick div:hover{background:rgba(42,91,215,.07)}.pick div.sel{background:rgba(22,163,74,.12)}
.pick .em{cursor:default;color:var(--mut)}.pick .em:hover{background:none}
.muted{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--glass-bd);background:rgba(255,255,255,.6);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:12px;padding:9px 15px;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600;color:#30406a;transition:all .2s}
.tabs button:hover{background:rgba(255,255,255,.85)}
.tabs button.on{background:linear-gradient(135deg,var(--pri2),var(--pri));border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(42,91,215,.3)}

/* ---------- Log masuk ---------- */
.login-wrap{position:relative;overflow:hidden;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
 background:radial-gradient(700px 500px at 15% 10%,rgba(91,132,241,.55),transparent 60%),radial-gradient(520px 420px at 90% 20%,rgba(227,34,43,.35),transparent 60%),
 radial-gradient(600px 460px at 75% 95%,rgba(247,198,0,.30),transparent 60%),linear-gradient(150deg,#0b1d4d,#1d3f94 60%,#14306f)}
.login-box{position:relative;background:rgba(255,255,255,.80);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.6);
 border-radius:24px;padding:30px 28px;width:100%;max-width:410px;text-align:center;box-shadow:0 30px 70px rgba(5,14,40,.45)}
.login-box::before{content:"";position:absolute;left:28px;right:28px;top:0;height:4px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--pri2) 0 60%,var(--red) 60% 82%,var(--yel) 82%)}
.login-box img{width:104px;height:104px;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(11,29,77,.25))}
.login-box h2{margin:12px 0 2px;font-size:19px;font-weight:800;color:var(--navy)}.login-box form{text-align:left;margin-top:16px}
.login-box .btn{padding:12px 16px;font-size:15px}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px;font-weight:600}

/* ---------- Modal, toast, pemuat ---------- */
.modal{position:fixed;inset:0;background:rgba(11,29,77,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:fade .18s}
.modal-box{background:rgba(255,255,255,.92);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-bd);border-radius:22px;width:100%;max-width:660px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 30px 70px rgba(11,29,77,.35);animation:pop .22s}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:16px;font-weight:800;color:var(--navy)}
.modal-head button{border:0;background:rgba(29,63,148,.08);width:32px;height:32px;border-radius:50%;font-size:20px;cursor:pointer;line-height:1;color:var(--pri)}
.modal-body{padding:18px 20px;overflow:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.upd{position:fixed;top:calc(76px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:65;display:flex;align-items:center;gap:10px;
 padding:10px 10px 10px 14px;border-radius:16px;max-width:calc(100vw - 20px);width:max-content;color:#fff;font-size:13px;line-height:1.3;
 background:linear-gradient(135deg,rgba(11,29,77,.92),rgba(42,91,215,.9));-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
 border:1px solid rgba(255,255,255,.25);box-shadow:0 14px 34px rgba(11,29,77,.35);animation:updIn .35s ease}
.upd-ic{font-size:20px;animation:spin 2.4s linear infinite}
.upd-tx small{opacity:.85}
.upd .btn{background:#fff;color:var(--pri);box-shadow:none}.upd .btn:hover{background:#eef3ff}
.upd-x{border:0;background:rgba(255,255,255,.15);color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:17px;line-height:1;flex:0 0 auto}
@keyframes updIn{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media print{.upd{display:none!important}}
#toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
.toast{background:rgba(11,29,77,.88);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 12px 28px rgba(11,29,77,.3);animation:pop .2s}
.toast.err{background:rgba(227,34,43,.92)}.toast.ok{background:rgba(22,163,74,.92)}
#loader{position:fixed;top:0;left:0;height:3px;width:0;z-index:70;transition:width .4s;background:linear-gradient(90deg,var(--pri2),var(--red),var(--yel))}
#loader.on{width:85%}

/* ---------- Komponen lain ---------- */
.lvl{display:flex;gap:4px;margin:10px 0 6px}.lvl span{flex:1;height:12px;border-radius:4px;background:rgba(29,63,148,.10)}
.bar{height:8px;background:rgba(29,63,148,.10);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--pri3),var(--pri))}
.sp{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.sp+.bar{margin-top:6px}
.info{background:rgba(42,91,215,.08);border:1px solid rgba(42,91,215,.20);border-radius:14px;padding:11px 14px;font-size:13px;color:var(--pri)}
.card.info{background:rgba(232,239,255,.75)}
.warn{background:rgba(247,198,0,.14);border:1px solid rgba(234,179,8,.45);color:#7a5a00}
.logo-prev{width:110px;height:110px;object-fit:contain;border:1px dashed rgba(29,63,148,.3);border-radius:16px;padding:8px;background:rgba(255,255,255,.7)}
.right{text-align:right}.nowrap{white-space:nowrap}
.vchart{display:flex;align-items:flex-end;gap:3px;height:180px;border-bottom:1px solid var(--line);padding-top:18px}
.vchart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.vchart i{display:block;width:100%;max-width:34px;background:linear-gradient(180deg,var(--pri3),var(--pri));border-radius:6px 6px 0 0;min-height:1px}
.vchart b{font-size:10px;color:var(--mut);font-weight:700}
.vlabels{display:flex;gap:3px;margin-top:4px}.vlabels span{flex:1;text-align:center;font-size:10px;color:var(--mut);overflow:hidden;white-space:nowrap;min-width:0}
.rpt-head{display:flex;gap:14px;align-items:center;border-bottom:3px solid var(--pri);padding-bottom:12px;margin-bottom:14px}
.rpt-head img{width:66px;height:66px;object-fit:contain}
.print-only{display:none}
/* ---------- Dokumen cetakan rasmi ---------- */
#printArea{display:none}
.pd{font-family:Arial,Helvetica,sans-serif;color:#000;font-size:10pt;line-height:1.38;padding:0 2px}
.pd-lh{display:flex;align-items:center;gap:16px;padding-bottom:8px;border-bottom:3px solid #1d3f94;position:relative;margin-bottom:10px}
.pd-lh::after{content:"";position:absolute;left:0;right:0;bottom:-6px;border-bottom:1px solid #1d3f94}
.pd-lh img{width:74px;height:82px;object-fit:contain;flex:0 0 auto}
.pd-lh .tx{flex:1;text-align:center;padding-right:74px}
.pd-sch{font-size:14pt;font-weight:700;color:#0b1d4d;text-transform:uppercase;letter-spacing:.4px;line-height:1.2}
.pd-addr{font-size:9pt;color:#111;margin-top:2px}
.pd-title{text-align:center;font-size:12.5pt;font-weight:700;text-transform:uppercase;margin:18px 0 2px;letter-spacing:.6px;color:#0b1d4d}
.pd-sub{text-align:center;font-size:10pt;margin-bottom:4px}
.pd-meta{width:100%;border-collapse:collapse;margin:10px 0 6px;font-size:9.5pt}
.pd-meta td{padding:2px 4px;vertical-align:top}.pd-meta td.k{width:17%;font-weight:700;white-space:nowrap}.pd-meta td.s{width:2%}
.pd h4{font-size:10pt;margin:16px 0 6px;color:#0b1d4d;text-transform:uppercase;letter-spacing:.3px;border-left:4px solid #1d3f94;padding-left:7px;break-after:avoid}
.pd-tbl{width:100%;border-collapse:collapse;font-size:9pt}
.pd-tbl th,.pd-tbl td{border:1px solid #7a8394;padding:4px 6px;vertical-align:top;text-align:left}
.pd-tbl th{background:#dfe7f8;color:#0b1d4d;font-weight:700;font-size:8.5pt;text-transform:uppercase}
.pd-tbl thead{display:table-header-group}.pd-tbl tr{break-inside:avoid}
.pd-tbl .c{text-align:center}.pd-tbl .r{text-align:right}.pd-tbl .nw{white-space:nowrap}
.pd-tbl tfoot td{font-weight:700;background:#f0f4fb}
.pd-tbl small{color:#444}
.pd-2col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tg{display:inline-block;padding:0 6px;border:1px solid;border-radius:3px;font-size:8pt;font-weight:700;white-space:nowrap}
.tg-Ringan{color:#15803d}.tg-Sederhana{color:#c2410c}.tg-Berat{color:#c1121f}.tg-none{color:#555}
.tg-BELUM{color:#c1121f}.tg-PROSES{color:#a16207}.tg-SELESAI{color:#15803d}
.cb{display:inline-block;width:11px;height:11px;border:1px solid #000;vertical-align:-1px;margin-right:2px;font-size:9px;line-height:10px;text-align:center;font-weight:700}
.pd-tbl tr.tall td{padding-top:9px;padding-bottom:9px}
.pd-break{break-before:page;height:0}
.pd-tbl tr.grp td{border-top:2px solid #1d3f94}
.pd-sm{font-size:8pt}.pd-sm th{font-size:7.5pt}.pd-sm td,.pd-sm th{padding:3px 4px}
.pd-in{width:100%;border-collapse:collapse}.pd-in td{border:0;border-bottom:1px dotted #9aa3b5;padding:3px 3px;vertical-align:top}.pd-in tr:last-child td{border-bottom:0}
.fill{margin-top:9px;display:flex;gap:4px;align-items:flex-end;white-space:nowrap}.fill .dl{flex:1;border-bottom:1px dotted #000;min-width:40px;height:12px}
.pd-note{font-size:8.5pt;color:#333;margin-top:6px;font-style:italic}
.pd-sign{display:flex;gap:28px;margin-top:34px;break-inside:avoid}
.pd-sign>div{flex:1;font-size:9.5pt}
.pd-sign .ln{border-bottom:1px dotted #000;height:46px;margin:4px 0 4px}
.pd-end{text-align:center;font-size:8pt;color:#555;margin-top:22px}
.pd .vchart{height:130px;border-bottom:1px solid #7a8394}.pd .vchart i{background:#2a5bd7}.pd .vchart b,.pd .vlabels span{color:#333}
.pd *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
 .card,.stat,.tabs button{background:rgba(255,255,255,.95)}nav{background:rgba(255,255,255,.97)}.login-box{background:#fff}
}
@media(max-width:600px){.hd-jwt{max-width:130px}.uinfo b{display:inline-block;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}main{padding:12px 10px calc(96px + env(safe-area-inset-bottom))}nav button{min-width:68px;padding:6px 8px 5px}.stat .n{font-size:23px}.card{padding:15px}.hero{padding:16px}.hero h2{font-size:17px}}
@media print{
  body.pdoc>*:not(#printArea){display:none!important}
  body.pdoc #printArea{display:block}
  body.pdoc{background:#fff}
  .topbar,nav,.toolbar,.noprint,#toast,#loader{display:none!important}
  body{background:#fff;font-size:12px}body::before{display:none}
  .card,.stat{box-shadow:none;border:1px solid #ccd5e8;background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none;break-inside:avoid}
  main{max-width:none;padding:0}.print-only{display:block}
  .badge,.bar i,.vchart i,.stat::before,.hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

</div>

<script id="app-js">
/* =====================================================================
   KONFIGURASI
   ===================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbz6Y7R92O10DAWw5pgEkTlS9bPkXoWccl-QA_lhylEFt-Ug_lLzE08L5GQmytY2sgZB/exec';
const APP_VERSI = '5.2';   // naikkan nombor ini setiap kali index.html dikemas kini (paparan sahaja)
const BACKEND_VERSI = 5;
const IN_GAS = !!(window.google && google.script && google.script.run);

/* =====================================================================
   KEADAAN & UTILITI
   ===================================================================== */
const LS = {
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const S = {token:LS.get('dm_token')||'', user:null, set:{}, logo:'', kelas:[], murid:[], muridArkib:[], kes:[], users:[],
  tindakanBuka:0, moeisBelum:0, tahunArkib:[], view:'dashboard', tab:'umum', pick:[], recs:[], rpt:null};
const $ = s => document.querySelector(s);
const esc = v => String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SVG_LOGO = 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path d="M32 4 8 12v18c0 15 10 26 24 30 14-4 24-15 24-30V12z" fill="#1d3f94"/><path d="M22 32l7 7 13-14" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>');
const DEF_LOGO = IN_GAS ? SVG_LOGO : 'logo.png';
const BULAN = ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
const BULAN_PENUH = ['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
const STATUS = {BELUM:'Belum diambil tindakan',PROSES:'Dalam proses',SELESAI:'Selesai'};

function localISO(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString(); }
const today = () => localISO().slice(0,10);
const nowHM = () => localISO().slice(11,16);
const fmtD = s => s && /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4)+(s.length>10?s.slice(10,16):'') : (s||'');
const isAdmin = () => S.user && S.user.Pentadbir;
const isGuru = () => S.user && S.user.Peranan==='GURU';
const ownOnly = () => S.user && S.user.Peranan==='PENGAWAS' && S.set.PengawasLihat!=='SEMUA';
const kelasSort = (a,b) => String(a).localeCompare(String(b),'ms',{numeric:true});
const muridByNo = no => S.murid.find(m=>m.NoDaftar===no) || S.muridArkib.find(m=>m.NoDaftar===no);
const roleName = u => u.Peranan==='GURU' ? (u.Pentadbir===true||u.Pentadbir==='YA' ? 'Guru (Pentadbir)' : 'Guru') : 'Pengawas';
const optKelas = (sel,first) => (first!==undefined?`<option value="">${esc(first)}</option>`:'') + S.kelas.map(k=>`<option ${k===sel?'selected':''}>${esc(k)}</option>`).join('');
const kesLabel = k => k.Kesalahan + (k.Butiran?' – '+k.Butiran:'');

let busy=0;
function loading(on){ busy=Math.max(0,busy+(on?1:-1)); $('#loader').classList.toggle('on',busy>0); }

function toast(msg,type){
  const t=document.createElement('div'); t.className='toast '+(type||''); t.textContent=msg;
  $('#toast').appendChild(t); setTimeout(()=>t.remove(), type==='err'?6000:3500);
}

async function api(action,data){
  const payload={action,data:data||{},token:S.token};
  loading(true);
  try{
    let res;
    if(IN_GAS){
      const txt = await new Promise((ok,ko)=>google.script.run.withSuccessHandler(ok).withFailureHandler(ko).api(JSON.stringify(payload)));
      res = JSON.parse(txt);
    }else{
      if(!API_URL) throw new Error('API_URL belum ditetapkan dalam fail frontend.');
      let r;
      try{ r = await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}); }
      catch(e){ throw new Error(navigator.onLine===false?'Tiada sambungan internet.':'Gagal menghubungi pelayan. Cuba lagi.'); }
      res = await r.json();
    }
    if(!res.ok){ const e=new Error(res.error||'Ralat tidak diketahui.'); e.code=res.code; throw e; }
    return res.data;
  }catch(e){
    if(e.code==='AUTH' && action!=='login') endSession();
    if(e.code==='PWCHANGE') showPwChange();
    throw e;
  }finally{ loading(false); }
}

/* ---------- Modal ---------- */
function modal(title, body, buttons){
  $('#mTitle').textContent=title; $('#mBody').innerHTML=body;
  const f=$('#mFoot'); f.innerHTML='';
  $('#mX').onclick=closeModal;
  (buttons||[{t:'Tutup',cls:'sec'}]).forEach(b=>{
    const el=document.createElement('button'); el.className='btn '+(b.cls||''); el.textContent=b.t;
    el.onclick=async()=>{
      if(b.fn){
        el.disabled=true;
        try{ const r=await b.fn(); if(r===false){ el.disabled=false; return; } }
        catch(e){ toast(e.message,'err'); el.disabled=false; return; }
      }
      closeModal();
    };
    f.appendChild(el);
  });
  $('#modal').classList.remove('hidden');
}
function closeModal(){ $('#modal').classList.add('hidden'); $('#mBody').innerHTML=''; }
function ask(msg, okText, cls){
  return new Promise(res=>{
    modal('Pengesahan', `<p>${msg}</p>`, [
      {t:'Batal',cls:'sec',fn:()=>{res(false);}},
      {t:okText||'Ya',cls:cls||'red',fn:()=>{res(true);}}
    ]);
    $('#mX').onclick=()=>{res(false);closeModal();};
  });
}

/* ---------- Tahap demerit ---------- */
function had(){ return {a:Math.max(1,+S.set.HadRingan||3), b:Math.max(1,+S.set.HadSederhana||3)}; }
function tahapOf(n){ const {a,b}=had(); if(n<=0) return ''; return n<=a?'Ringan':(n<=a+b?'Sederhana':'Berat'); }
function badge(t){ return t?`<span class="badge b-${esc(t)}">${esc(t)}</span>`:'<span class="badge b-none">Tiada</span>'; }
function sBadge(st){ return `<span class="badge b-${esc(st)}">${esc(STATUS[st]||st)}</span>`; }
function lvlBar(n){
  const {a,b}=had(); let h='<div class="lvl">';
  for(let i=0;i<a;i++) h+=`<span style="${i<n?'background:var(--ringan)':''}"></span>`;
  for(let i=0;i<b;i++) h+=`<span style="${a+i<n?'background:var(--sederhana)':''}"></span>`;
  h+=`<span style="flex:1.6;${n>a+b?'background:var(--berat)':''}"></span></div>`;
  return h+`<div class="muted">Ringan ${Math.min(n,a)}/${a} · Sederhana ${Math.max(0,Math.min(n-a,b))}/${b} · Berat ${Math.max(0,n-a-b)}</div>`;
}
function skopText(){ return S.set.SkopKiraan==='SEMUA' ? 'secara terkumpul (keseluruhan)' : 'bagi setiap tahun kalendar (bermula semula setiap Januari)'; }

/* ---------- Penjenamaan ---------- */
function applyBrand(school, sys, logo){
  const src = logo || DEF_LOGO;
  ['#lgLogo','#hdLogo','#pwLogo'].forEach(s=>$(s).src=src);
  if(logo) $('#favicon').href=logo;
  $('#lgSchool').textContent = school || 'Sistem Demerit';
  $('#hdSchool').textContent = school || '';
  $('#lgSys').textContent = $('#hdSys').textContent = sys || 'Sistem Demerit Murid';
  document.title = (sys||'Sistem Demerit Murid') + (school?' | '+school:'');
}

/* =====================================================================
   DOKUMEN CETAKAN RASMI
   ===================================================================== */
function pageStyle(land){
  const q=v=>String(v||'').replace(/["\\\n]/g,' ');
  const f='font-family:Arial,Helvetica,sans-serif;font-size:8pt;color:#444;';
  const sulit=S.set.CetakSulit!=='TIDAK';
  $('#pgStyle').textContent=`@page{size:A4 ${land?'landscape':'portrait'};margin:${land?'12mm 12mm 14mm':'15mm 14mm 17mm 14mm'};
    @bottom-left{content:"${q(S.set.NamaSistem)}";${f}}
    @bottom-right{content:"Halaman " counter(page) " / " counter(pages);${f}}
    ${sulit?`@top-center{content:"SULIT";${f}font-size:9pt;font-weight:bold;color:#000;letter-spacing:2px}
    @bottom-center{content:"SULIT";${f}font-size:9pt;font-weight:bold;color:#000;letter-spacing:2px}`:''}}`;
}
function pdTag(t){ return t?`<span class="tg tg-${esc(t)}">${esc(STATUS[t]?STATUS[t]:t)}</span>`:'<span class="tg tg-none">Tiada</span>'; }
function pdHead(title, sub, meta){
  const s=S.set;
  const kontak=[s.NoTelefon?'Tel: '+s.NoTelefon:'', s.Emel?'E-mel: '+s.Emel:'', s.KodSekolah?'Kod Sekolah: '+s.KodSekolah:''].filter(Boolean).join('   |   ');
  const all=(meta||[]).concat([['Dicetak oleh',S.user.Nama],['Tarikh cetak',fmtD(today())+' '+nowHM()]]);
  let rows=''; for(let i=0;i<all.length;i+=2){ const a=all[i], b=all[i+1];
    rows+=`<tr><td class="k">${esc(a[0])}</td><td class="s">:</td><td>${esc(a[1])}</td>${b?`<td class="k">${esc(b[0])}</td><td class="s">:</td><td>${esc(b[1])}</td>`:'<td></td><td></td><td></td>'}</tr>`; }
  return `<div class="pd-lh"><img src="${S.logo||DEF_LOGO}" alt=""><div class="tx"><div class="pd-sch">${esc(s.NamaSekolah)}</div>
      ${s.AlamatSekolah?`<div class="pd-addr">${esc(s.AlamatSekolah).replace(/\n/g,', ')}</div>`:''}${kontak?`<div class="pd-addr">${esc(kontak)}</div>`:''}</div></div>
    <div class="pd-title">${esc(title)}</div>${sub?`<div class="pd-sub">${esc(sub)}</div>`:''}
    <table class="pd-meta">${rows}</table>`;
}
function pdSign(list){
  return `<div class="pd-sign">${list.map(x=>`<div>${esc(x[0])}:<div class="ln"></div>Nama: ${x[1]?esc(x[1]):'..........................................'}<br>${x[2]?'Jawatan: '+esc(x[2])+'<br>':''}Tarikh: ...............................</div>`).join('')}</div>`;
}
async function printDoc(html, noEnd, land){
  const a=$('#printArea');
  a.innerHTML=`<div class="pd">${html}${noEnd?'':`<div class="pd-end">— Dokumen ini dijana oleh ${esc(S.set.NamaSistem||'Sistem Demerit Murid')} —</div>`}</div>`;
  pageStyle(land); document.body.classList.add('pdoc');
  await Promise.all([...a.querySelectorAll('img')].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r;})));
  setTimeout(()=>window.print(),80);
}
window.addEventListener('afterprint',()=>document.body.classList.remove('pdoc'));
function skopLabel(){ return S.set.SkopKiraan==='SEMUA'?'Keseluruhan (terkumpul)':'Tahun '+today().slice(0,4); }

const mLbl={SUDAH:'Sudah dimasukkan',BELUM:'Belum dimasukkan'};
function mBadge(st){ return st==='SUDAH'?'<span class="badge b-SELESAI">Sudah dimasukkan</span>':'<span class="badge b-BELUM">Belum dimasukkan</span>'; }
function moeisPrint(P){
  const L=P.moeis||[], N=S.set.MoeisSetiap||3, jenis=S.set.MoeisSkop==='SEMUA'?'rekod kesalahan':'rekod kesalahan ringan';
  const cb=on=>`<span class="cb">${on?'✓':''}</span>`;
  return `<h4>C. Rekod Kemasukan Sistem MOEIS <span style="text-transform:none;font-weight:400">(diisi oleh Guru Disiplin)</span></h4>
    <div class="pd-note" style="margin:0 0 6px;font-style:normal">Setiap ${esc(N)} ${jenis} perlu dimasukkan ke dalam sistem MOEIS.</div>

    el.style.backgroundImage = data ? `linear-gradient(160deg,rgba(11,29,77,${o}),rgba(29,63,148,${Math.max(0,o-.1)})), url("${data}")` : '';

  try{
    const r = await api('login',{login:$('#lgUser').value,password:$('#lgPass').value});
    S.token=r.token; LS.set('dm_token',r.token);
    if(r.user.mustChange){ $('#pwOld').value=$('#lgPass').value; $('#lgPass').value=''; showPwChange(); $('#pwNew').focus(); return; }
    $('#lgPass').value=''; S.view='dashboard'; await boot({welcome:true});
  }catch(err){ $('#lgErr').textContent=err.message; }
  finally{ $('#lgBtn').disabled=false; }
};
$('#pwForm').onsubmit = async e=>{
  e.preventDefault(); $('#pwErr').textContent='';
  if($('#pwNew').value!==$('#pwNew2').value){ $('#pwErr').textContent='Pengesahan kata laluan tidak sepadan.'; return; }
  $('#pwBtn').disabled=true;
  try{
    await api('changePassword',{lama:$('#pwOld').value,baru:$('#pwNew').value});
    ['#pwOld','#pwNew','#pwNew2'].forEach(s=>$(s).value='');
    toast('Kata laluan berjaya ditukar.','ok'); S.view='dashboard'; await boot({welcome:true});
  }catch(err){ $('#pwErr').textContent=err.message; }
  finally{ $('#pwBtn').disabled=false; }
};
$('#pwOut').onclick = async()=>{ try{ await api('logout'); }catch(e){} endSession(); };
$('#btnOut').onclick = async()=>{ try{ await api('logout'); }catch(e){} endSession(); };

function salamMasa(){
  const j=new Date().getHours();
  return j<12?{t:'Selamat Pagi',i:'☀️'}:j<19?{t:'Selamat Petang',i:'🌤️'}:{t:'Selamat Malam',i:'🌙'};
}
function jawatanUser(){ return S.user.Jawatan || roleName(S.user); }
let welTimer=null, welClock=null;
function showWelcome(){
  const w=$('#welcome'), sl=salamMasa();
  const bg=LS.get('dm_bg'), ov=Math.max(0,Math.min(90,+(LS.get('dm_bg_ov')||35)))/100;
  w.style.backgroundImage = bg ? `linear-gradient(160deg,rgba(11,29,77,${Math.max(ov,.45)}),rgba(29,63,148,${Math.max(ov-.1,.35)})), url("${bg}")` : '';
  const tkh=new Date().toLocaleDateString('ms-MY',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const info=[];
  if(isGuru()&&S.tindakanBuka) info.push(`🛎️ ${S.tindakanBuka} tindakan susulan belum selesai`);
  if(isGuru()&&S.moeisBelum) info.push(`🗂️ ${S.moeisBelum} kemasukan MOEIS belum dibuat`);
  w.innerHTML=`<div class="wel-box">
    <img src="${S.logo||DEF_LOGO}" alt="">
    <div class="wel-salam"><span>${sl.i}</span>${sl.t}</div>
    <div class="wel-nama">${esc(S.user.Nama)}</div>
    <div class="wel-jwt">${esc(jawatanUser())}</div>
    <div class="wel-sek">${esc(S.set.NamaSekolah||'')}<br><span style="opacity:.8;font-weight:500">${esc(S.set.NamaSistem||'Sistem Demerit Murid')}</span></div>
    <div class="wel-masa"><div>📅 ${esc(tkh)}</div><div>🕒 <b id="welJam"></b></div></div>
    ${info.length?`<div class="wel-info">${info.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}
    <div class="wel-bar"><i></i></div>
  </div>`;
  const tick=()=>{ const e=$('#welJam'); if(e) e.textContent=new Date().toLocaleTimeString('ms-MY',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); };
  tick(); clearInterval(welClock); welClock=setInterval(tick,1000);
  w.classList.remove('hidden','out');
  const close=()=>{ if(w.classList.contains('hidden')||w.classList.contains('out')) return; clearTimeout(welTimer); clearInterval(welClock);
    w.classList.add('out'); setTimeout(()=>w.classList.add('hidden'),430); document.removeEventListener('keydown',key); };
  const key=e=>{ if(e.key==='Enter'||e.key==='Escape') close(); };
  document.addEventListener('keydown',key);
  clearTimeout(welTimer); welTimer=setTimeout(close,4000);
}
async function boot(opt){
  const d = await api('bootstrap');
  S.user=d.user; S.set=d.settings||{}; S.logo=d.logo; S.kelas=d.kelas; S.murid=d.murid; S.muridArkib=d.muridArkib||[];
  S.kes=d.kesalahan; S.users=d.users||[]; S.jawatan=d.jawatan||[]; S.tindakanBuka=d.tindakanBuka||0; S.moeisBelum=d.moeisBelum||0; S.tahunArkib=d.tahunArkib||[];
  applyBrand(S.set.NamaSekolah,S.set.NamaSistem,S.logo);
  $('#hdUser').textContent=S.user.Nama; $('#hdRole').textContent=jawatanUser(); $('#hdRole').title=roleName(S.user);
  showOnly('#app');
  renderNav(); go(S.view);
  if(opt&&opt.welcome) showWelcome();
  if((d.versi||1)<BACKEND_VERSI && isAdmin()) modal('⚠️ Backend Perlu Dikemas Kini',`<p>Frontend ini memerlukan <b>Code.gs Versi ${BACKEND_VERSI}</b>, tetapi Apps Script masih menjalankan versi ${d.versi||1}. Sesetengah fungsi (Tetapan, Tindakan, Laporan, Sandaran) tidak akan berfungsi.</p><ol><li>Ganti seluruh Code.gs dengan fail backend terkini dan simpan.</li><li>Jalankan fungsi <b>setup</b> sekali.</li><li>Deploy → Manage deployments → Edit → Version: <b>New version</b> → Deploy.</li></ol>`);
}

function navItems(){
  const it=[['dashboard','📊 Utama']];
  if(isGuru() || S.set.PengawasRekod==='YA') it.push(['rekod','✍️ Rekod']);
  it.push(['senarai','📋 Senarai'],['profil','👤 Profil']);
  if(isGuru()) it.push(['tindakan','🛎️ Tindakan'],['moeis','🗂️ MOEIS'],['laporan','📑 Laporan']);
  if(isAdmin()) it.push(['tetapan','⚙️ Tetapan']);
  it.push(['akaun','🔑 Akaun']);
  return it;
}
function renderNav(){
  $('#nav').innerHTML = navItems().map(([k,t])=>{ const sp=t.indexOf(' '); return `<button data-v="${k}" class="${S.view===k?'on':''}" title="${esc(t.slice(sp+1))}"><span class="ni">${t.slice(0,sp)}</span><span class="nl">${esc(t.slice(sp+1))}</span>${k==='tindakan'&&S.tindakanBuka?`<span class="dot">${S.tindakanBuka}</span>`:''}${k==='moeis'&&S.moeisBelum?`<span class="dot">${S.moeisBelum}</span>`:''}</button>`; }).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.v));
}
function setOpenCount(n){ S.tindakanBuka=n; renderNav(); }
function setMoeisCount(n){ S.moeisBelum=n; renderNav(); }
async function go(v){
  if(!navItems().some(x=>x[0]===v)) v='dashboard';
  S.view=v; renderNav(); window.scrollTo(0,0);
  const fn={dashboard:vDashboard,rekod:vRekod,senarai:vSenarai,profil:vProfil,tindakan:vTindakan,moeis:vMoeis,laporan:vLaporan,tetapan:vTetapan,akaun:vAkaun}[v];
  try{ await fn(); }catch(e){ $('#view').innerHTML=`<div class="card"><div class="err">${esc(e.message)}</div></div>`; }
}

function stat(l,n,cls,attr){ return `<div class="stat ${cls||''}" ${attr||''}><div class="n">${n}</div><div class="l">${esc(l)}</div></div>`; }
function bars(list,empty){
  if(!list.length) return `<div class="muted">${empty||'Tiada data.'}</div>`;
  const max=Math.max(...list.map(x=>x.bil))||1;
  return list.map(x=>`<div style="margin:8px 0"><div class="sp"><span>${esc(x.label)}</span><b>${x.bil}</b></div><div class="bar"><i style="width:${(x.bil/max*100).toFixed(1)}%"></i></div></div>`).join('');
}

function kesGroups(){
  const g=new Map();
  S.kes.filter(k=>k.Aktif!=='TIDAK').forEach(k=>{ if(!g.has(k.Kesalahan)) g.set(k.Kesalahan,[]); g.get(k.Kesalahan).push(k); });
  return g;
}
function vRekod(){
  S.pick=[];
  const g=kesGroups(), {a,b}=had();
  $('#view').innerHTML = `
  <div class="card"><h3>✍️ Rekod Kesalahan Murid</h3>
    <div class="row">
      <div><label>Tarikh</label><input type="date" id="rTarikh" value="${today()}" max="${today()}"></div>
      <div><label>Masa</label><input type="time" id="rMasa" value="${nowHM()}"></div>
    </div>
    <label>Cari & Pilih Murid <span class="muted">(boleh pilih lebih daripada seorang)</span></label>
    <div class="row">
      <div style="flex:0 0 170px"><select id="rKelas">${optKelas('', 'Semua kelas')}</select></div>
      <div><input id="rCari" placeholder="Taip nama atau no. pendaftaran…" autocomplete="off"></div>
    </div>
    <div class="pick" id="rList"></div>
    <label>Murid dipilih (<span id="rBil">0</span>)</label>
    <div class="chips" id="rChips"></div>
    <div class="row">
      <div><label>Kesalahan</label><select id="rKes"><option value="">— Pilih kesalahan —</option>${[...g.keys()].map(k=>`<option>${esc(k)}</option>`).join('')}</select></div>
      <div id="rSubW" class="hidden"><label>Butiran</label><select id="rSub"></select></div>
    </div>
    <label>Catatan (pilihan)</label>
    <textarea id="rCat" maxlength="500" placeholder="Contoh: semasa PdP Matematik"></textarea>
    <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn sec" id="rReset">Kosongkan</button>
      <button class="btn" id="rSave">💾 Simpan Rekod</button>
    </div>
  </div>
  <div class="card info">
    <b>Peraturan peningkatan tahap:</b> Kesalahan ke-1 hingga ke-${a} direkod sebagai <b>Ringan</b>.
    Kesalahan ke-${a+1} hingga ke-${a+b} dikira sebagai <b>Sederhana</b>.
    Kesalahan ke-${a+b+1} dan seterusnya dikira sebagai <b>Berat</b>. Kiraan dibuat ${skopText()} dan disusun mengikut tarikh kejadian.
  </div>`;
  $('#rKelas').onchange=renderPickList; $('#rCari').oninput=renderPickList;
  $('#rKes').onchange=()=>{
    const grp=g.get($('#rKes').value)||[];
    const needSub = grp.length>1 || (grp.length===1 && grp[0].Butiran);
    $('#rSubW').classList.toggle('hidden',!needSub);
    $('#rSub').innerHTML = needSub ? '<option value="">— Pilih butiran —</option>'+grp.map(k=>`<option value="${esc(k.ID)}">${esc(k.Butiran||'(Umum)')}</option>`).join('') : '';
  };
  $('#rTarikh').onchange=()=>refreshCounts(S.pick.map(p=>p.NoDaftar));
  $('#rReset').onclick=()=>vRekod();
  $('#rSave').onclick=saveRekod;
  renderPickList(); renderChips();
}
function renderPickList(){
  const k=$('#rKelas').value, q=$('#rCari').value.trim().toLowerCase();
  const el=$('#rList');
  if(!k && q.length<2){ el.innerHTML='<div class="em">Pilih kelas atau taip sekurang-kurangnya 2 huruf untuk mencari murid.</div>'; return; }
  let list=S.murid.filter(m=>(!k||m.Kelas===k) && (!q || (m.NamaPenuh+' '+m.NoDaftar).toLowerCase().includes(q)));
  list.sort((x,y)=>kelasSort(x.Kelas,y.Kelas)||x.NamaPenuh.localeCompare(y.NamaPenuh));
  const more=list.length>80; list=list.slice(0,80);
  el.innerHTML = list.length ? list.map(m=>`<div data-no="${esc(m.NoDaftar)}" class="${S.pick.some(p=>p.NoDaftar===m.NoDaftar)?'sel':''}">${esc(m.NamaPenuh)} <span class="muted">· ${esc(m.Kelas)} · ${esc(m.NoDaftar)}</span></div>`).join('')+(more?'<div class="em">…hasil dipendekkan, perincikan carian.</div>':'') : '<div class="em">Tiada murid dijumpai.</div>';
  el.querySelectorAll('div[data-no]').forEach(d=>d.onclick=()=>togglePick(d.dataset.no));
}
function togglePick(no){
  const i=S.pick.findIndex(p=>p.NoDaftar===no);
  if(i>=0) S.pick.splice(i,1);
  else { const m=S.murid.find(x=>x.NoDaftar===no); if(!m) return; S.pick.push(Object.assign({},m,{count:null})); refreshCounts([no]); }
  renderChips(); renderPickList();
}
async function refreshCounts(list){
  if(!list.length) return;
  list.forEach(no=>{ const p=S.pick.find(x=>x.NoDaftar===no); if(p) p.count=null; }); renderChips();
  try{
    const r=await api('studentStatus',{noDaftarList:list,tarikh:$('#rTarikh')?$('#rTarikh').value:today()});
    Object.keys(r).forEach(no=>{ const p=S.pick.find(x=>x.NoDaftar===no); if(p) p.count=r[no].count; });
    renderChips();
  }catch(e){ toast(e.message,'err'); }
}
function renderChips(){
  const el=$('#rChips'); if(!el) return;
  $('#rBil').textContent=S.pick.length;
  const back = $('#rTarikh') && $('#rTarikh').value<today();
  el.innerHTML = S.pick.length ? S.pick.map(p=>`<div class="chip"><div><b>${esc(p.NamaPenuh)}</b><div class="muted">${esc(p.Kelas)} · ${esc(p.NoDaftar)}</div>
    <div style="margin-top:4px">${p.count==null?'<span class="muted">Menyemak rekod…</span>':`Rekod sedia ada: <b>${p.count}</b> → ${back?'≈ ':''}kesalahan ke-${p.count+1} ${badge(tahapOf(p.count+1))}`}</div></div>
    <button title="Buang" data-no="${esc(p.NoDaftar)}">×</button></div>`).join('')
    + (back?'<div class="muted" style="width:100%">Tarikh lampau: kedudukan sebenar akan disusun semula mengikut tarikh selepas disimpan.</div>':'')
    : '<span class="muted">Belum ada murid dipilih.</span>';
  el.querySelectorAll('button[data-no]').forEach(b=>b.onclick=()=>togglePick(b.dataset.no));
}
function selectedKesID(){
  const grp=kesGroups().get($('#rKes').value)||[];
  if(!grp.length) return '';
  if(grp.length===1 && !grp[0].Butiran) return grp[0].ID;
  return $('#rSub').value;
}
async function saveRekod(){
  if(!S.pick.length) return toast('Sila pilih sekurang-kurangnya seorang murid.','err');
  const kid=selectedKesID();
  if(!kid) return toast('Sila pilih kesalahan dan butirannya.','err');
  const btn=$('#rSave'); btn.disabled=true;
  try{
    const res=await api('recordOffence',{noDaftarList:S.pick.map(p=>p.NoDaftar),kesalahanID:kid,tarikh:$('#rTarikh').value,masa:$('#rMasa').value,catatan:$('#rCat').value});
    const out=Array.isArray(res)?res:res.records;
    if(res.tindakanBaru && isGuru()) setOpenCount(S.tindakanBuka+res.tindakanBaru);
    if(res.moeisBaru && isGuru()) setMoeisCount(S.moeisBelum+res.moeisBaru);
    modal('✅ Rekod Disimpan', `<p>${out.length} rekod berjaya disimpan.</p><div class="tw"><table class="tbl"><thead><tr><th>Murid</th><th>Kesalahan ke-</th><th>Tahap</th></tr></thead><tbody>
      ${out.map(r=>`<tr><td>${esc(r.NamaPenuh)}<div class="muted">${esc(r.Kelas)}</div></td><td>${esc(r.Bilangan)}</td><td>${badge(r.Tahap)}</td></tr>`).join('')}</tbody></table></div>
      ${res.tindakanBaru?`<p class="info warn" style="margin-top:12px">${res.tindakanBaru} tindakan susulan baharu telah diwujudkan dalam menu <b>Tindakan</b> kerana murid mencapai tahap Sederhana/Berat.</p>`
        :(out.some(r=>r.Tahap!=='Ringan')?'<p class="info warn" style="margin-top:12px">Terdapat murid di tahap Sederhana/Berat. Sila maklumkan kepada guru disiplin / guru kelas.</p>':'')}
      ${res.moeisBaru?`<p class="info" style="margin-top:10px;background:rgba(227,34,43,.08);border-color:rgba(227,34,43,.3);color:#9f1239">📌 <b>${res.moeisBaru} kemasukan MOEIS diperlukan.</b> Murid telah mencapai ${esc(S.set.MoeisSetiap||3)} rekod ${S.set.MoeisSkop==='SEMUA'?'kesalahan':'kesalahan ringan'}. Sila masukkan ke dalam sistem MOEIS${isGuru()?' dan tandakan dalam menu <b>MOEIS</b>':' (maklumkan kepada guru disiplin)'}.</p>`:''}`);
    S.pick=[]; $('#rCat').value=''; renderChips(); renderPickList();
  }catch(e){ toast(e.message,'err'); }
  finally{ btn.disabled=false; }
}

async function loadRecs(){
  $('#fTbl').innerHTML='<div class="muted">Memuatkan…</div>';

    const F={dari:$('#fDari').value,hingga:$('#fHingga').value,kelas:$('#fKelas').value,tahap:$('#fTahap').value,q:$('#fQ').value.trim()};
    const r=await api('listRecords',F);

    const upd=()=>{ const ids=sel(), murid=[...new Set(S.recs.filter(x=>ids.includes(x.ID)).map(x=>x.NoDaftar))];

    document.querySelectorAll('#fTbl .rC').forEach(c=>c.onchange=upd); upd();
    $('#fSelR').onclick=()=>{ const ids=sel(); printRecs(S.recs.filter(x=>ids.includes(x.ID)), true); };
    $('#fSelP').onclick=()=>{ const ids=sel(); printBulk([...new Set(S.recs.filter(x=>ids.includes(x.ID)).map(x=>x.NoDaftar))]); };
  }catch(e){ $('#fTbl').innerHTML=`<div class="err">${esc(e.message)}</div>`; }

function recTable(list, canEdit, pick){

function bindRecActions(root, list, after){
  root.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!await ask('Padam rekod ini? Tindakan ini tidak boleh dibatalkan.<br><span class="muted">Nombor "kesalahan ke-" dan tahap bagi rekod lain murid ini akan dikira semula secara automatik.</span>','Padam')) return;
    try{ await api('deleteRecord',{ID:b.dataset.del}); toast('Rekod dipadam dan kiraan dikemas kini.','ok'); after(); }catch(e){ toast(e.message,'err'); }
  });
  root.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>editRecord(list.find(r=>r.ID===b.dataset.ed), after));
}
function editRecord(r, after){
  if(!r) return;
  const opts=S.kes.filter(k=>k.Aktif!=='TIDAK'||k.ID===r.KesalahanID)
    .map(k=>`<option value="${esc(k.ID)}" ${k.ID===r.KesalahanID?'selected':''}>${esc(kesLabel(k))}${k.Aktif==='TIDAK'?' (tidak aktif)':''}</option>`).join('');

    <div class="row"><div><label>Tarikh</label><input type="date" id="eT" value="${esc(r.Tarikh)}" max="${today()}"></div><div><label>Masa</label><input type="time" id="eM" value="${esc(r.Masa)}"></div></div>
    <label>Kesalahan</label><select id="eK">${kesAda?'':`<option value="" selected>${esc(kesLabel(r))} (asal)</option>`}${opts}</select>
    <label>Catatan</label><textarea id="eC" maxlength="500">${esc(r.Catatan)}</textarea>
    <div class="muted" style="margin-top:8px">Jika tarikh diubah, kedudukan "kesalahan ke-" dan tahap murid ini dikira semula secara automatik.</div>`,[
    {t:'Batal',cls:'sec'},
    {t:'Simpan',fn:async()=>{
      await api('updateRecord',{ID:r.ID,tarikh:$('#eT').value,masa:$('#eM').value,kesalahanID:$('#eK').value,catatan:$('#eC').value});

    }}
  ]);

function exportRecs(){
  if(!S.recs.length) return toast('Tiada rekod untuk dieksport.','err');
  const rows=S.recs.map(r=>({'Tarikh':fmtD(r.Tarikh),'Masa':r.Masa,'No. Pendaftaran':r.NoDaftar,'Nama Penuh':r.NamaPenuh,'Kelas':r.Kelas,
    'Kesalahan':r.Kesalahan,'Butiran':r.Butiran,'Catatan':r.Catatan,'Kesalahan Ke-':Number(r.Bilangan)||r.Bilangan,'Tahap':r.Tahap,
    'Direkod Oleh':r.DirekodOleh,'Peranan':r.Peranan==='PENGAWAS'?'Pengawas':'Guru'}));
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[{wch:11},{wch:7},{wch:16},{wch:38},{wch:12},{wch:28},{wch:20},{wch:30},{wch:13},{wch:11},{wch:26},{wch:10}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Rekod Demerit');
  XLSX.writeFile(wb,`Rekod_Demerit_${today()}.xlsx`);
}

function rptRange(){
  const j=$('#lJ').value;
  if(j==='BULAN'){ const m=$('#lB').value||today().slice(0,7); const [yy,mm]=m.split('-').map(Number);
    const last=new Date(yy,mm,0).getDate(); return {dari:m+'-01',hingga:m+'-'+String(last).padStart(2,'0'),tajuk:'Laporan Bulanan: '+BULAN_PENUH[mm-1]+' '+yy}; }
  if(j==='TAHUN'){ const yy=$('#lT').value; return {dari:yy+'-01-01',hingga:yy+'-12-31',tajuk:'Laporan Tahunan '+yy}; }
  return {dari:$('#lDari').value,hingga:$('#lHingga').value,tajuk:'Laporan '+fmtD($('#lDari').value)+' hingga '+fmtD($('#lHingga').value)};
}
function vchart(list, daily){
  if(!list.length) return '<div class="muted">Tiada data.</div>';
  const max=Math.max(...list.map(x=>x.bil))||1;
  const lbl=x=>daily? String(+x.label.slice(8,10)) : BULAN[+x.label.slice(5,7)-1]+(list.length>12?' '+x.label.slice(2,4):'');
  const step=Math.ceil(list.length/16);
  return `<div class="vchart">${list.map(x=>`<div title="${esc(x.label)}: ${x.bil}"><b>${x.bil||''}</b><i style="height:${(x.bil/max*100).toFixed(1)}%"></i></div>`).join('')}</div>
    <div class="vlabels">${list.map((x,i)=>`<span>${i%step===0?lbl(x):''}</span>`).join('')}</div>`;
}
async function genReport(){

  if(!R.dari||!R.hingga||R.dari>R.hingga) return toast('Julat tarikh tidak sah.','err');
  const out=$('#lOut'); out.innerHTML='<div class="card muted">Menjana laporan…</div>';
  try{
    const d=await api('report',{dari:R.dari,hingga:R.hingga});
    d.tajuk=R.tajuk; S.rpt=d;
    const pct=n=>d.jumlah?Math.round(n/d.jumlah*100)+'%':'0%';
    out.innerHTML=`
    <div class="toolbar"><button class="btn sec" id="lPrt">🖨 Cetak / Simpan PDF</button><button class="btn grn" id="lXls">⬇ Eksport Excel</button></div>
    <div class="card">
      <div class="rpt-head"><img src="${S.logo||DEF_LOGO}"><div><b style="font-size:16px">${esc(d.sekolah)}</b><br>${esc(d.tajuk)}<br><span class="muted">Tempoh: ${fmtD(d.dari)} – ${fmtD(d.hingga)} · Dijana: ${fmtD(d.dijana)}</span></div></div>
      <div class="grid g6" style="margin:0">
        ${stat('Jumlah kesalahan',d.jumlah)}${stat('Murid terlibat',d.muridUnik)}
        ${stat('Ringan ('+pct(d.tahap.Ringan)+')',d.tahap.Ringan,'ringan')}${stat('Sederhana ('+pct(d.tahap.Sederhana)+')',d.tahap.Sederhana,'sederhana')}${stat('Berat ('+pct(d.tahap.Berat)+')',d.tahap.Berat,'berat')}
        ${stat('Tindakan selesai',d.tindakan.SELESAI+' / '+(d.tindakan.BELUM+d.tindakan.PROSES+d.tindakan.SELESAI),'amber')}
      </div>
    </div>
    <div class="card"><h3>Trend ${d.trendHarian?'Harian':'Bulanan'}</h3>${vchart(d.trend,d.trendHarian)}</div>
    <div class="grid g2">
      <div class="card"><h3>Kesalahan Mengikut Jenis</h3>${bars(d.ikutKesalahan)}</div>
      <div class="card"><h3>Mengikut Hari</h3>${bars(d.ikutHari.filter(x=>x.bil||(x.label!=='Sabtu'&&x.label!=='Ahad')))}</div>
    </div>
    <div class="card"><h3>Ringkasan Mengikut Kelas</h3><div class="tw"><table class="tbl"><thead><tr><th>Kelas</th><th class="right">Murid terlibat</th><th class="right">Ringan</th><th class="right">Sederhana</th><th class="right">Berat</th><th class="right">Jumlah</th></tr></thead><tbody>
      ${d.ikutKelas.length?d.ikutKelas.map(k=>`<tr><td>${esc(k.label)}</td><td class="right">${k.bilMurid}</td><td class="right">${k.Ringan}</td><td class="right">${k.Sederhana}</td><td class="right">${k.Berat}</td><td class="right"><b>${k.bil}</b></td></tr>`).join(''):'<tr><td colspan="6" class="muted">Tiada data.</td></tr>'}
    </tbody></table></div></div>
    <div class="grid g2">
      <div class="card"><h3>Murid Paling Kerap (20 teratas)</h3><div class="tw"><table class="tbl"><thead><tr><th>#</th><th>Murid</th><th>Kelas</th><th class="right">Bil</th><th>Tahap terkini</th></tr></thead><tbody>
        ${d.topMurid.length?d.topMurid.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(m.NamaPenuh)}<div class="muted">${esc(m.NoDaftar)}</div></td><td>${esc(m.Kelas)}</td><td class="right"><b>${m.bil}</b></td><td>${badge(m.tahap)}</td></tr>`).join(''):'<tr><td colspan="5" class="muted">Tiada data.</td></tr>'}
      </tbody></table></div></div>
      <div class="card"><h3>Direkod Oleh</h3>${bars(d.ikutPegawai)}
        <h3 style="margin-top:18px">Status Tindakan Susulan (diwujudkan dalam tempoh ini)</h3>
        <div class="sp"><span>${sBadge('BELUM')}</span><b>${d.tindakan.BELUM}</b></div>
        <div class="sp" style="margin-top:6px"><span>${sBadge('PROSES')}</span><b>${d.tindakan.PROSES}</b></div>
        <div class="sp" style="margin-top:6px"><span>${sBadge('SELESAI')}</span><b>${d.tindakan.SELESAI}</b></div>
      </div>
    </div>
`;
    $('#lXls').onclick=exportReport; $('#lPrt').onclick=printReport;
  }catch(e){ out.innerHTML=`<div class="card err">${esc(e.message)}</div>`; }
}
function exportReport(){
  const d=S.rpt; if(!d) return;
  const wb=XLSX.utils.book_new();
  const ring=XLSX.utils.aoa_to_sheet([[d.sekolah],[d.tajuk],['Tempoh',fmtD(d.dari)+' – '+fmtD(d.hingga)],[],
    ['Jumlah kesalahan',d.jumlah],['Murid terlibat',d.muridUnik],['Ringan',d.tahap.Ringan],['Sederhana',d.tahap.Sederhana],['Berat',d.tahap.Berat],[],
    ['Tindakan: Belum',d.tindakan.BELUM],['Tindakan: Dalam proses',d.tindakan.PROSES],['Tindakan: Selesai',d.tindakan.SELESAI]]);
  ring['!cols']=[{wch:26},{wch:30}];
  XLSX.utils.book_append_sheet(wb,ring,'Ringkasan');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.ikutKelas.map(k=>({'Kelas':k.label,'Murid terlibat':k.bilMurid,'Ringan':k.Ringan,'Sederhana':k.Sederhana,'Berat':k.Berat,'Jumlah':k.bil}))),'Ikut Kelas');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.ikutKesalahan.map(k=>({'Kesalahan':k.label,'Bilangan':k.bil}))),'Ikut Kesalahan');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.topMurid.map((m,i)=>({'#':i+1,'No. Pendaftaran':m.NoDaftar,'Nama':m.NamaPenuh,'Kelas':m.Kelas,'Bilangan':m.bil,'Tahap terkini':m.tahap}))),'Murid Kerap');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.trend.map(t=>({'Tempoh':d.trendHarian?fmtD(t.label):t.label,'Bilangan':t.bil}))),'Trend');
  XLSX.writeFile(wb,`Laporan_Demerit_${d.dari}_${d.hingga}.xlsx`);
}

function resizeImage(file,max,type,q){
  return new Promise((ok,ko)=>{
    const rd=new FileReader();
    rd.onerror=()=>ko(new Error('Gagal membaca fail imej.'));
    rd.onload=()=>{
      const img=new Image();
      img.onerror=()=>ko(new Error('Fail bukan imej yang sah.'));
      img.onload=()=>{
        const sc=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        ok(c.toDataURL(type||'image/png',q));
      };
      img.src=rd.result;
    };
    rd.readAsDataURL(file);
  });
}

function guessNext(k){
  const m=String(k).match(/^(\s*)(\d+)(.*)$/);
  if(!m) return '';
  const n=+m[2]; if(n>=5) return '__TAMAT__';
  return m[1]+(n+1)+m[3];
}
function promoteForm(){
  const cnt={}; S.murid.forEach(m=>cnt[m.Kelas]=(cnt[m.Kelas]||0)+1);
  const kel=S.kelas.filter(k=>cnt[k]);

  modal('Naik Kelas Hujung Tahun',`
    <div class="info" style="margin-bottom:10px">Tetapkan kelas baharu bagi setiap kelas. Cadangan diisi automatik (cth. 1 Amanah → 2 Amanah, Tingkatan 5 → Tamat). Semak sebelum memproses.<br>

    {t:'Batal',cls:'sec'},

      const map={};
      document.querySelectorAll('.pSel').forEach(s=>{
        const k=kel[+s.dataset.i];

    const inp=document.querySelector(`.pIn[data-i="${s.dataset.i}"]`); inp.hidden=s.value!=='__LAIN__'; if(!inp.hidden) inp.focus();

function pickFile(handler){
  const fi=$('#fileIn'); fi.value='';
  fi.onchange=()=>{ const f=fi.files[0]; if(f) handler(f); };
  fi.click();
}
async function readSheet(file){
  if(typeof XLSX==='undefined') throw new Error('Pustaka Excel gagal dimuatkan. Semak sambungan internet.');
  const wb=XLSX.read(await file.arrayBuffer());
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
}
function mapCols(aoa,defs){
  for(let i=0;i<Math.min(aoa.length,10);i++){
    const row=aoa[i].map(c=>String(c).toLowerCase().trim()); const idx={};
    Object.keys(defs).forEach(k=>{ idx[k]=row.findIndex(c=>defs[k].some(w=>c.includes(w))); });
    if(Object.values(idx).every(x=>x>=0)) return {start:i+1,idx};
  }
  return null;
}
async function importMuridFile(file){
  try{
    const aoa=await readSheet(file);
    const mp=mapCols(aoa,{no:['daftar'],nama:['nama'],kelas:['kelas']});
    if(!mp) throw new Error('Tajuk lajur tidak dijumpai. Gunakan templat: "No. Pendaftaran Murid", "Nama Penuh", "Kelas".');
    const rows=[];
    for(let i=mp.start;i<aoa.length;i++){
      const r=aoa[i]; const o={NoDaftar:String(r[mp.idx.no]||'').trim(),NamaPenuh:String(r[mp.idx.nama]||'').trim(),Kelas:String(r[mp.idx.kelas]||'').trim(),baris:i+1};
      if(o.NoDaftar||o.NamaPenuh||o.Kelas) rows.push(o);
    }
    if(!rows.length) throw new Error('Tiada data murid dalam fail.');
    const sah=rows.filter(r=>r.NoDaftar&&r.NamaPenuh&&r.Kelas).length;
    const ada=new Set(S.murid.map(m=>m.NoDaftar));
    const baru=rows.filter(r=>r.NoDaftar&&r.NamaPenuh&&r.Kelas&&!ada.has(r.NoDaftar)).length;
    modal('Import Senarai Murid',`
      <p><b>${rows.length}</b> baris dibaca daripada <i>${esc(file.name)}</i> · <b>${sah}</b> lengkap · ${rows.length-sah} tidak lengkap (akan diabaikan).</p>
      <div class="tw" style="max-height:220px"><table class="tbl"><thead><tr><th>No.</th><th>Nama</th><th>Kelas</th></tr></thead><tbody>
      ${rows.slice(0,15).map(r=>`<tr><td>${esc(r.NoDaftar)}</td><td>${esc(r.NamaPenuh)}</td><td>${esc(r.Kelas)}</td></tr>`).join('')}
      ${rows.length>15?`<tr><td colspan="3" class="muted">…dan ${rows.length-15} lagi</td></tr>`:''}</tbody></table></div>
      <label>Kaedah import</label>
      <select id="iMode"><option value="TAMBAH">Tambah & kemas kini (${baru} murid baharu, ${Math.max(0,sah-baru)} dikemas kini)</option>
      <option value="GANTI">Ganti keseluruhan senarai murid aktif</option></select>
      <div class="info warn" style="margin-top:10px">"Ganti keseluruhan" akan membuang semua murid aktif yang tiada dalam fail ini. Rekod kesalahan tidak terjejas.</div>`,[
      {t:'Batal',cls:'sec'},
      {t:'Import',cls:'grn',fn:async()=>{
        const r=await api('importMurid',{rows,mode:$('#iMode').value});
        S.murid=r.murid; S.kelas=r.kelas; S.muridArkib=r.muridArkib||S.muridArkib;
        toast(`Import selesai: ${r.tambah} baharu, ${r.kemaskini} dikemas kini.`,'ok');
        tMurid();
        if(r.ralat.length) setTimeout(()=>modal('Catatan Import',`<p>${r.ralat.length} catatan:</p><div style="max-height:300px;overflow:auto" class="muted">${r.ralat.map(esc).join('<br>')}</div>`),50);
      }}
    ]);
  }catch(e){ toast(e.message,'err'); }
}

/* ---------- Jawatan ---------- */
function tJawatan(){
  const L={GURU:S.jawatan.filter(j=>j.Peranan==='GURU').map(j=>Object.assign({},j)),PENGAWAS:S.jawatan.filter(j=>j.Peranan==='PENGAWAS').map(j=>Object.assign({},j))};
  const used=(p,n)=>S.users.filter(u=>u.Peranan===p&&u.Jawatan===n).length;
  $('#tBody').innerHTML=`
  <div class="info" style="margin-bottom:12px">Senarai jawatan ini dipilih semasa mendaftar akses guru dan pengawas. Jawatan pengguna juga dicetak pada ruangan "Disediakan oleh" dalam dokumen. Menukar nama jawatan akan turut mengemas kini pengguna yang memegang jawatan tersebut.</div>
  <div class="grid g2">${['GURU','PENGAWAS'].map(p=>`<div class="card"><h3>${p==='GURU'?'👩‍🏫 Jawatan Guru':'🛡️ Jawatan Pengawas'}</h3>
    <div class="tw"><table class="tbl"><thead><tr><th>#</th><th>Nama jawatan</th><th class="right">Pengguna</th><th></th></tr></thead><tbody id="j_${p}"></tbody></table></div>
    <button class="btn sec sm" style="margin-top:10px" data-add="${p}">+ Tambah jawatan</button></div>`).join('')}</div>
  <div style="text-align:right"><button class="btn" id="jSave">💾 Simpan Jawatan</button></div>`;
  const draw=p=>{
    $('#j_'+p).innerHTML=L[p].map((j,i)=>`<tr><td>${i+1}</td><td><input data-p="${p}" data-i="${i}" value="${esc(j.Nama)}"></td><td class="right">${j.ID?used(p,j.Nama):0}</td>
      <td class="nowrap right"><button class="btn sm sec" data-up="${p}|${i}" ${i?'':'disabled'}>↑</button> <button class="btn sm sec" data-dn="${p}|${i}" ${i<L[p].length-1?'':'disabled'}>↓</button> <button class="btn sm red" data-x="${p}|${i}">✕</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted">Tiada jawatan.</td></tr>';
    $('#j_'+p).querySelectorAll('input').forEach(el=>el.oninput=()=>{ L[p][+el.dataset.i].Nama=el.value; });
    const mv=(k,d)=>{ const [pp,ii]=k.split('|'); const i=+ii, t=L[pp][i]; L[pp].splice(i,1); L[pp].splice(i+d,0,t); draw(pp); };
    $('#j_'+p).querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>mv(b.dataset.up,-1));
    $('#j_'+p).querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>mv(b.dataset.dn,1));
    $('#j_'+p).querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{ const [pp,ii]=b.dataset.x.split('|'); const j=L[pp][+ii];
      if(j.ID&&used(pp,j.Nama)) return toast(`Jawatan "${j.Nama}" masih digunakan oleh ${used(pp,j.Nama)} pengguna. Tukar jawatan pengguna dahulu.`,'err');
      L[pp].splice(+ii,1); draw(pp); });
  };
  draw('GURU'); draw('PENGAWAS');
  $('#tBody').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{ const p=b.dataset.add; L[p].push({ID:'',Nama:'',Peranan:p}); draw(p); const ins=$('#j_'+p).querySelectorAll('input'); ins[ins.length-1].focus(); });
  $('#jSave').onclick=async()=>{
    try{ const r=await api('saveJawatan',L); S.jawatan=r.jawatan; S.users=r.users; toast('Senarai jawatan disimpan.','ok'); tJawatan(); }
    catch(e){ toast(e.message,'err'); }
  };
}

  $('#bAuto').onclick=async()=>{ try{ await api('setAutoBackup',{on:!sb.auto}); toast(sb.auto?'Sandaran automatik dimatikan.':'Sandaran automatik dihidupkan.','ok'); tSistem(); }catch(e){ toast(e.message,'err'); } };
  $('#bRe').onclick=async()=>{
    if(!await ask('Kira semula "kesalahan ke-" dan tahap bagi semua rekod aktif?','Kira Semula','amb')) return;
    try{ const r=await api('recomputeAll'); toast(r.berubah?`${r.berubah} rekod dikemas kini.`:'Semua kiraan sudah tepat.','ok'); }catch(e){ toast(e.message,'err'); }
  };
  $('#tBody').querySelectorAll('[data-yr]').forEach(b=>b.onclick=async()=>{
    const y=b.dataset.yr;
    if(!await ask(`Arkibkan semua rekod tahun <b>${esc(y)}</b> ke helaian Arkib_${esc(y)}?<br><span class="muted">Rekod arkib tidak boleh diedit atau dipadam. Disyorkan buat sandaran dahulu.</span>`,'Arkibkan','amb')) return;
    try{ await api('archiveYear',{tahun:y}); S.tahunArkib.push(y); toast(`Rekod tahun ${y} diarkibkan.`,'ok'); tSistem(); }catch(e){ toast(e.message,'err'); }
  });
}

          .map(t=>`<option>${t}</option>`).join('')}</select></div>
      <button class="btn" id="lgGo">🔍 Cari</button>
    </div>
    <div class="tw" id="lgTbl"></div>

  const load=async()=>{

    try{
      const l=await api('listLog',{q:$('#lgQ').value.trim(),tindakan:$('#lgT').value,limit:500});

        ${l.map(x=>`<tr><td class="nowrap">${fmtD(x.Masa)}</td><td>${esc(x.Pengguna)}</td><td class="nowrap"><b>${esc(x.Tindakan)}</b></td><td style="word-break:break-word">${esc(x.Butiran)}</td></tr>`).join('')}</tbody></table>`:'<div class="muted">Tiada entri.</div>';
    }catch(e){ $('#lgTbl').innerHTML=`<div class="err">${esc(e.message)}</div>`; }
  };
  $('#lgGo').onclick=load; $('#lgT').onchange=load; $('#lgQ').onkeydown=e=>{if(e.key==='Enter')load();};
  load();
}

/* ===================================================================== */
/* =====================================================================
   PENGESANAN VERSI BAHARU
   Bandingkan CSS + JS halaman semasa dengan index.html terkini di pelayan.
   ===================================================================== */
const UPD = {shown:false, dismissedAt:0, ver:''};
function hashStr(t){ let h=0x811c9dc5; for(let i=0;i<t.length;i++){ h^=t.charCodeAt(i); h=Math.imul(h,0x01000193); } return (h>>>0).toString(16); }
function partOf(html,tag,id){ const a='<'+tag+' id="'+id+'">', i=html.indexOf(a); if(i<0) return null; const j=html.indexOf('</'+tag+'>',i); return j<0?null:html.slice(i+a.length,j); }
const SIG_NOW = hashStr((($('#app-css')||{}).textContent||'')+'|'+(($('#app-js')||{}).textContent||''));
function showUpdate(ver){
  if(ver) UPD.ver=ver;
  if(UPD.dismissedAt && Date.now()-UPD.dismissedAt<30*60*1000) return;   // ditutup: tunjuk semula selepas 30 minit
  $('#updVer').textContent = UPD.ver && UPD.ver!==APP_VERSI ? ` (v${UPD.ver})` : '';
  $('#updBar').classList.remove('hidden'); UPD.shown=true;
}
async function checkUpdate(){
  if(IN_GAS || !/^https?:$/.test(location.protocol)) return;
  try{
    const r=await fetch('index.html?_v='+Date.now(),{cache:'no-store'});
    if(!r.ok) return;
    const t=await r.text(), css=partOf(t,'style','app-css'), js=partOf(t,'script','app-js');
    if(css==null||js==null) return;
    if(hashStr(css+'|'+js)!==SIG_NOW){ const m=t.match(/const APP_VERSI = '([^']+)'/); showUpdate(m?m[1]:''); }
  }catch(e){}
}
async function doRefresh(){
  const b=$('#updBtn'); b.disabled=true; b.textContent='Mengemas kini…';
  try{
    if('serviceWorker' in navigator){
      const reg=await navigator.serviceWorker.getRegistration();
      if(reg){ await reg.update().catch(()=>{}); if(reg.waiting) reg.waiting.postMessage('SKIP_WAITING'); }
    }
    if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
  }catch(e){}
  location.reload();
}
$('#updBtn').onclick=doRefresh;
$('#updX').onclick=()=>{ $('#updBar').classList.add('hidden'); UPD.dismissedAt=Date.now(); };
setTimeout(checkUpdate, 8000);                                   // semakan pertama
setInterval(checkUpdate, 10*60*1000);                            // setiap 10 minit
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkUpdate(); });

init();
</script>

<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistem Demerit Murid</title>
<!--
  =====================================================================
   SISTEM DEMERIT MURID — FRONTEND · Versi 2
   GitHub Pages: simpan sebagai index.html bersama manifest.json,
   sw.js, icon-192.png dan icon-512.png dalam folder yang sama.
  =====================================================================

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1d4d">
<script>try{var z=localStorage.getItem('dm_fon');if(z&&z!=='1')document.documentElement.style.zoom=z;}catch(e){}</script>
<script>try{var t=localStorage.getItem('dm_tema');if(t==='gelap'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='dark';}catch(e){}</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Demerit">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="icon" id="favicon" href="icon-192.png">
<style id="app-css">
:root{
--navy:#0b1d4d;--pri:#1d3f94;--pri2:#2a5bd7;--pri3:#5b84f1;--red:#e3222b;--yel:#f7c600;
--txt:#0f1d3d;--mut:#5b6b8c;--line:rgba(29,63,148,.10);
--glass:rgba(255,255,255,.68);--glass-hi:rgba(255,255,255,.86);--glass-bd:rgba(255,255,255,.75);
--ringan:#16a34a;--sederhana:#ea7a0c;--berat:#e3222b;--r:18px;
--sh:0 12px 32px rgba(11,29,77,.10),0 2px 6px rgba(11,29,77,.06);
--blur:blur(20px) saturate(170%);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--txt);font-size:15px;min-height:100vh;background:#e8eefc;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(900px 620px at -5% -10%,rgba(42,91,215,.42),transparent 60%),
 radial-gradient(640px 480px at 105% 5%,rgba(227,34,43,.14),transparent 62%),
 radial-gradient(760px 560px at 90% 105%,rgba(247,198,0,.18),transparent 60%),
 radial-gradient(900px 700px at 5% 105%,rgba(29,63,148,.32),transparent 60%),
 linear-gradient(160deg,#eef3ff 0%,#dde7fb 55%,#e9effd 100%)}
.hidden{display:none!important}
::selection{background:rgba(42,91,215,.22)}

/* ---------- Bar atas & navigasi ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top));position:sticky;top:0;z-index:20;min-height:66px;color:#fff;
 background:linear-gradient(120deg,rgba(11,29,77,.92),rgba(29,63,148,.86));-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
 box-shadow:0 8px 24px rgba(11,29,77,.25)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--pri2) 0 60%,var(--red) 60% 82%,var(--yel) 82%)}
.topbar img{width:46px;height:46px;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.brand{flex:1;min-width:0}.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{opacity:.8;font-size:12px;letter-spacing:.3px}
.uinfo{text-align:right;font-size:12px;line-height:1.35}.uinfo b{font-size:13px;font-weight:700}
.uinfo span{opacity:.85}
.hd-jwt{display:inline-block;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;font-weight:600}
/* ---------- Petunjuk kitaran & rekod terdahulu ---------- */
.badge.b-kit{background:#7c3aed}.badge.b-lama{background:#0e7490}
@media print{.badge.b-kit,.badge.b-lama{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
/* ---------- Kad pengesahan (telefon) ---------- */
.sk-cards{display:none}
.sk-card{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--glass-hi);transition:transform .2s,opacity .25s,background .2s;touch-action:pan-y}
.sk-card.ok{transform:translateX(110%)!important;opacity:0}.sk-card.no{transform:translateX(-110%)!important;opacity:0}
.sk-btn{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}.sk-btn .btn.grn{flex:1}
@media(max-width:700px){.sk-cards{display:block}.sk-tbl{display:none}#sSah,#sTolak{display:none}}
/* ---------- Saiz tulisan ---------- */
@media print{html{zoom:1!important}}
/* ---------- Garis masa sejarah ---------- */
.tl{position:relative;padding-left:4px}.tl::before{content:"";position:absolute;left:19px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl-i{position:relative;display:flex;gap:12px;padding:8px 0}
.tl-d{flex:0 0 32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;box-shadow:0 0 0 4px var(--glass-hi);z-index:1}
/* ---------- MOD GELAP ---------- */
html[data-theme=dark]{color-scheme:dark;--txt:#e3eaff;--mut:#97a6c8;--line:rgba(148,170,230,.14);--navy:#d4defc;
 --glass:rgba(16,26,52,.74);--glass-hi:rgba(21,33,64,.88);--glass-bd:rgba(120,150,230,.16);--sh:0 12px 32px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.3)}
html[data-theme=dark] body{background:#060d20}
html[data-theme=dark] body::before{background:radial-gradient(900px 620px at -5% -10%,rgba(42,91,215,.30),transparent 60%),radial-gradient(640px 480px at 105% 5%,rgba(227,34,43,.10),transparent 62%),
 radial-gradient(760px 560px at 90% 105%,rgba(247,198,0,.08),transparent 60%),linear-gradient(160deg,#08112a 0%,#0a1633 55%,#070f25 100%)}
html[data-theme=dark] label{color:#b9c7ea}
html[data-theme=dark] input,html[data-theme=dark] select,html[data-theme=dark] textarea{background:rgba(8,16,38,.85);border-color:rgba(148,170,230,.22);color:var(--txt)}
html[data-theme=dark] input:focus,html[data-theme=dark] select:focus,html[data-theme=dark] textarea:focus{background:rgba(10,20,46,.95)}
html[data-theme=dark] input:disabled{background:rgba(30,40,70,.6)}
html[data-theme=dark] .btn.sec,html[data-theme=dark] .qk button{background:rgba(28,42,80,.9);color:#cddbff;border-color:rgba(148,170,230,.22)}
html[data-theme=dark] nav{background:rgba(10,18,40,.82);border-top-color:rgba(120,150,230,.16)}
html[data-theme=dark] nav button:hover{background:rgba(91,132,241,.14);color:#cddbff}
html[data-theme=dark] .tabs button{background:rgba(16,26,52,.7);color:#c4d1f3;border-color:rgba(120,150,230,.16)}
html[data-theme=dark] .tbl th{background:rgba(91,132,241,.12);color:#a9c0ff}
html[data-theme=dark] .tbl tbody tr:hover{background:rgba(91,132,241,.08)}
html[data-theme=dark] .tbl a,html[data-theme=dark] .modal-head button{color:#9db8ff}
html[data-theme=dark] .pick{background:rgba(8,16,38,.7);border-color:rgba(148,170,230,.18)}
html[data-theme=dark] .pick div:hover{background:rgba(91,132,241,.12)}html[data-theme=dark] .pick div.sel{background:rgba(34,197,94,.16)}
html[data-theme=dark] .chip{background:rgba(91,132,241,.14);border-color:rgba(91,132,241,.3)}
html[data-theme=dark] .info{background:rgba(91,132,241,.12);border-color:rgba(91,132,241,.28);color:#c3d3ff}
html[data-theme=dark] .card.info{background:rgba(22,36,72,.75)}
html[data-theme=dark] .warn{background:rgba(247,198,0,.10);border-color:rgba(247,198,0,.32);color:#fcd34d}
html[data-theme=dark] .modal-box{background:rgba(14,23,48,.97)}html[data-theme=dark] .modal-head button{background:rgba(91,132,241,.16)}
html[data-theme=dark] .login-box{background:rgba(14,23,48,.86);border-color:rgba(120,150,230,.22)}
html[data-theme=dark] .logo-prev,html[data-theme=dark] .wiz .st{background:rgba(16,26,52,.7)}
html[data-theme=dark] .sk{background:rgba(30,44,84,.5)!important}
html[data-theme=dark] .bar,html[data-theme=dark] .lvl span{background:rgba(148,170,230,.13)}
html[data-theme=dark] .stat.ringan .n{color:#4ade80}html[data-theme=dark] .stat.sederhana .n{color:#fb923c}html[data-theme=dark] .stat.berat .n{color:#f87171}html[data-theme=dark] .stat.amber .n{color:#fbbf24}
html[data-theme=dark] .heat td,html[data-theme=dark] .heat th{border-color:rgba(148,170,230,.1)}
html[data-theme=dark] .cmp-dn{color:#4ade80}html[data-theme=dark] .cmp-up{color:#f87171}
html[data-theme=dark] .b-none,html[data-theme=dark] .b-off{background:#475569}
html[data-theme=dark] .hero:not([style]){background:linear-gradient(125deg,#0b1d4d 0%,#1d3f94 55%,#2a5bd7 100%);box-shadow:0 14px 34px rgba(0,0,0,.4)}
@media print{html[data-theme=dark]{--txt:#0f1d3d;--mut:#5b6b8c;--navy:#0b1d4d;--glass:#fff;--glass-hi:#fff}html[data-theme=dark] body{background:#fff}}
/* ---------- Rangka pemuatan ---------- */
.sk{position:relative;overflow:hidden;background:rgba(255,255,255,.55)!important;border:1px solid var(--glass-bd)}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:shimmer 1.2s infinite}
.sk.stat::before{display:none}
@keyframes shimmer{to{transform:translateX(100%)}}
/* ---------- Mod latihan, luar talian, Google ---------- */
.lat{position:sticky;top:66px;z-index:18;text-align:center;padding:7px 12px;font-size:13px;color:#3b2f00;background:repeating-linear-gradient(135deg,#facc15 0 18px,#fde047 18px 36px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.lat button{margin-left:8px;border:0;border-radius:999px;padding:3px 10px;background:#3b2f00;color:#fde047;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
body.latihan .topbar{background:linear-gradient(120deg,rgba(92,64,0,.94),rgba(161,98,7,.9))}
.offb{position:sticky;top:66px;z-index:17;display:flex;justify-content:center;gap:10px;align-items:center;padding:7px 12px;font-size:13px;color:#fff;background:rgba(100,116,139,.95)}
.offb button{border:0;border-radius:999px;padding:3px 12px;background:#fff;color:#334155;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.or{display:flex;align-items:center;gap:10px;margin:16px 0 12px;color:var(--mut);font-size:12px}.or::before,.or::after{content:"";flex:1;height:1px;background:rgba(29,63,148,.15)}
.qk{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.qk button{border:1px solid rgba(29,63,148,.18);background:rgba(255,255,255,.85);border-radius:999px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:600;color:var(--pri);cursor:pointer;transition:all .15s}
.qk button:hover{background:rgba(42,91,215,.1)}.qk button.on{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;border-color:transparent}
.toast .tbtn{margin-left:12px;border:0;border-radius:8px;padding:4px 10px;background:#fff;color:var(--pri);font:inherit;font-weight:800;cursor:pointer}
.b-MENUNGGU{background:linear-gradient(135deg,#94a3b8,#64748b)}.b-DITOLAK{background:#334155}
.heat{border-collapse:collapse;font-size:12px;width:100%}.heat th,.heat td{padding:5px 4px;text-align:center;border:1px solid rgba(29,63,148,.08)}.heat th{color:var(--mut);font-weight:700}
.cmp-up{color:var(--berat);font-weight:700}.cmp-dn{color:var(--ringan);font-weight:700}
.wiz{display:grid;gap:12px}.wiz .st{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:14px;background:rgba(255,255,255,.7);border:1px solid var(--glass-bd)}
.wiz .no{flex:0 0 34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;background:rgba(29,63,148,.1);color:var(--pri)}
.wiz .st.done .no{background:var(--ringan);color:#fff}
/* ---------- Halaman sambutan ---------- */
.wel{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;color:#fff;overflow:hidden;
 background:radial-gradient(700px 500px at 15% 10%,rgba(91,132,241,.55),transparent 60%),radial-gradient(520px 420px at 90% 20%,rgba(227,34,43,.32),transparent 60%),
 radial-gradient(600px 460px at 75% 95%,rgba(247,198,0,.28),transparent 60%),linear-gradient(150deg,#0b1d4d,#1d3f94 60%,#14306f);background-size:cover;background-position:center;
 animation:fade .35s ease}
.wel.out{animation:welOut .45s ease forwards}
@keyframes welOut{to{opacity:0;transform:scale(1.03)}}
.wel-box{position:relative;width:100%;max-width:520px;text-align:center;padding:34px 28px 26px;border-radius:28px;
 background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);
 border:1px solid rgba(255,255,255,.28);box-shadow:0 30px 80px rgba(5,14,40,.45);animation:pop .5s ease}
.wel-box::before{content:"";position:absolute;left:36px;right:36px;top:0;height:4px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--pri3) 0 60%,var(--red) 60% 82%,var(--yel) 82%)}
.wel-box img{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35))}
.wel-salam{margin:14px 0 2px;font-size:15px;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.9}
.wel-salam span{display:inline-block;font-size:22px;vertical-align:-3px;margin-right:6px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px)}}
.wel-nama{font-size:28px;font-weight:800;line-height:1.2;margin:4px 0 10px;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.wel-jwt{display:inline-block;padding:6px 16px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--pri);font-weight:800;font-size:13.5px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.wel-sek{margin-top:14px;font-size:13px;opacity:.85;font-weight:600}
.wel-masa{margin-top:16px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.wel-masa div{padding:8px 14px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);font-size:13px}
.wel-masa b{font-size:18px;letter-spacing:1px}
.wel-info{margin-top:12px;font-size:12.5px;opacity:.9}
.wel-info span{display:inline-block;margin:3px 4px;padding:4px 10px;border-radius:999px;background:rgba(227,34,43,.35);border:1px solid rgba(255,255,255,.25)}
.wel-btn{margin-top:22px;width:100%;justify-content:center;padding:13px 18px;font-size:15px;background:#fff!important;color:var(--pri)!important;box-shadow:0 10px 26px rgba(0,0,0,.25)!important}
.wel-btn:focus{outline:none}.wel-btn:focus-visible{outline:3px solid rgba(255,255,255,.55);outline-offset:3px}
.wel-bar{margin-top:20px;height:3px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.wel-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--yel),#fff);transform-origin:left;animation:welBar 3s linear forwards}
@keyframes welBar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media(max-width:600px){.wel-nama{font-size:23px}.wel-box{padding:28px 20px 22px}}
.uinfo button,.instbtn{margin-top:4px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px 12px;cursor:pointer;font:inherit;font-size:12px;font-weight:600;transition:background .2s}
.uinfo button:hover,.instbtn:hover{background:rgba(255,255,255,.26)}
nav{display:flex;gap:4px;overflow-x:auto;padding:6px 10px calc(6px + env(safe-area-inset-bottom));position:fixed;left:0;right:0;bottom:0;z-index:30;scrollbar-width:none;justify-content:safe center;
 background:rgba(255,255,255,.72);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-top:1px solid var(--glass-bd);box-shadow:0 -8px 28px rgba(11,29,77,.12)}
nav::-webkit-scrollbar{display:none}
nav button{position:relative;flex:0 0 auto;min-width:76px;border:0;background:none;padding:7px 10px 6px;border-radius:14px;cursor:pointer;font:inherit;color:var(--mut);transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ni{font-size:20px;line-height:1.1}
nav button .nl{font-size:11px;font-weight:700;white-space:nowrap;letter-spacing:.1px}
nav button:hover{background:rgba(42,91,215,.08);color:var(--pri)}
nav button.on{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;box-shadow:0 6px 16px rgba(42,91,215,.35)}
nav button .dot{position:absolute;top:2px;right:10px;margin:0}
.dot{display:inline-block;min-width:19px;padding:0 6px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;margin-left:6px;text-align:center;line-height:18px;box-shadow:0 2px 6px rgba(227,34,43,.4)}
main{max-width:1180px;margin:0 auto;padding:20px 16px calc(100px + env(safe-area-inset-bottom))}

/* ---------- Kad kaca ---------- */
.card{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-bd);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:16px}
.card h3{margin:0 0 14px;font-size:16px;font-weight:700;color:var(--navy);letter-spacing:.1px}
.grid{display:grid;gap:14px;margin-bottom:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.g6{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.grid>.card{margin-bottom:0}
.hero{position:relative;overflow:hidden;border-radius:var(--r);padding:20px 22px;margin-bottom:16px;color:#fff;
 background:linear-gradient(125deg,var(--navy) 0%,var(--pri) 55%,var(--pri2) 100%);box-shadow:0 14px 34px rgba(29,63,148,.30)}
.hero::before{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(247,198,0,.35),transparent 65%)}
.hero::after{content:"";position:absolute;right:120px;bottom:-110px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(227,34,43,.30),transparent 65%)}
.hero h2{margin:0;font-size:20px;font-weight:800;position:relative}.hero p{margin:4px 0 0;opacity:.85;font-size:13px;position:relative}
.stat{position:relative;overflow:hidden;background:var(--glass-hi);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-bd);border-radius:16px;padding:14px 16px;box-shadow:var(--sh)}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--pri3),var(--pri))}
.stat .n{font-size:28px;font-weight:800;letter-spacing:-.5px;color:var(--navy)}
.stat .l{color:var(--mut);font-size:12.5px;font-weight:600}
.stat.ringan::before{background:linear-gradient(180deg,#4ade80,var(--ringan))}.stat.ringan .n{color:var(--ringan)}
.stat.sederhana::before{background:linear-gradient(180deg,#fdba74,var(--sederhana))}.stat.sederhana .n{color:var(--sederhana)}
.stat.berat::before{background:linear-gradient(180deg,#fb7185,var(--berat))}.stat.berat .n{color:var(--berat)}
.stat.amber::before{background:linear-gradient(180deg,#fde047,#eab308)}.stat.amber .n{color:#a16207}
.stat.click{cursor:pointer;transition:transform .2s}.stat.click:hover{transform:translateY(-2px)}

/* ---------- Borang ---------- */
label{display:block;font-size:12.5px;font-weight:700;margin:12px 0 5px;color:#30406a;letter-spacing:.2px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid rgba(29,63,148,.16);border-radius:12px;font:inherit;background:rgba(255,255,255,.88);color:inherit;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri2);box-shadow:0 0 0 4px rgba(42,91,215,.16);background:#fff}
input:disabled{background:rgba(241,245,255,.8);color:var(--mut)}
textarea{min-height:76px;resize:vertical}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--pri2)}
.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;color:#fff;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;
 background:linear-gradient(135deg,var(--pri2),var(--pri));box-shadow:0 6px 16px rgba(42,91,215,.28);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(42,91,215,.34)}
.btn:active{transform:translateY(0)}
.btn.sec{background:rgba(255,255,255,.85);color:var(--pri);border:1px solid rgba(29,63,148,.16);box-shadow:0 2px 8px rgba(11,29,77,.06)}

 radial-gradient(600px 460px at 75% 95%,rgba(247,198,0,.30),transparent 60%),linear-gradient(150deg,#0b1d4d,#1d3f94 60%,#14306f)}

.login-box::before{content:"";position:absolute;left:28px;right:28px;top:0;height:4px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--pri2) 0 60%,var(--red) 60% 82%,var(--yel) 82%)}

/* ---------- Dokumen cetakan rasmi ---------- */

.tg-BELUM{color:#c1121f}.tg-PROSES{color:#a16207}.tg-SELESAI{color:#15803d}

.lines div{border-bottom:1px dotted #000;height:20px}

}

const XLSX_URL='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
let xlsxP=null;
/** Muat skrip luaran sekali sahaja (QR dsb.) */
const jsP={};
function loadJS(url,test,nama){
  if(test()) return Promise.resolve();
  if(!jsP[url]) jsP[url]=new Promise((ok,ko)=>{ loading(true); const sc=document.createElement('script'); sc.src=url;
    sc.onload=()=>{ loading(false); ok(); }; sc.onerror=()=>{ loading(false); delete jsP[url]; ko(new Error('Pustaka '+nama+' gagal dimuatkan. Semak sambungan internet.')); };
    document.head.appendChild(sc); });
  return jsP[url];
}
/** Kalendar: amaran hujung minggu / cuti sekolah bagi tarikh t (yyyy-mm-dd) */
function cutiWarn(t){
  if(!t) return '';
  const c=(S.set.CutiSekolah||[]).find(x=>x.dari<=t&&t<=(x.hingga||x.dari));
  if(c) return `Tarikh ${fmtD(t)} jatuh pada cuti sekolah: ${c.nama}`;
  const d=new Date(t+'T00:00:00').getDay(), hm=S.set.HujungMinggu==='JUM_SAB'?[5,6]:[6,0];
  if(hm.includes(d)) return `Tarikh ${fmtD(t)} ialah hujung minggu (${['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'][d]})`;
  return '';
}
/** Rekod dikunci daripada edit/padam (guru bukan pentadbir, melebihi had jam) */
function editLocked(r){
  if(isAdmin()) return false;
  const jam=+(S.set.HadEditJam??48); if(!jam||!r.DimasukkanPada) return false;
  const m=String(r.DimasukkanPada).match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/); if(!m) return false;
  return Date.now()-new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5]).getTime() > jam*3600000;
}

async function api(action,data){
  const payload={action,data:data||{},token:S.token,latihan:S.latihan||undefined};
  loading(true);
  try{
    let res;
    if(IN_GAS){
      const txt = await new Promise((ok,ko)=>google.script.run.withSuccessHandler(ok).withFailureHandler(ko).api(JSON.stringify(payload)));
      res = JSON.parse(txt);
    }else{
      if(!API_URL) throw new Error('API_URL belum ditetapkan dalam fail frontend.');
      let r;
      try{ r = await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}); }
      catch(e){ const er=new Error(navigator.onLine===false?'Tiada sambungan internet.':'Gagal menghubungi pelayan. Cuba lagi.'); er.offline=true; throw er; }
      res = await r.json();
    }
    if(!res.ok){ const e=new Error(res.error||'Ralat tidak diketahui.'); e.code=res.code; throw e; }
    return res.data;
  }catch(e){
    if(e.code==='AUTH' && action!=='login' && action!=='loginGoogle') endSession();
    if(e.code==='PWCHANGE') showPwChange();
    throw e;
  }finally{ loading(false); }
}

/* ---------- Modal ---------- */
function modal(title, body, buttons){
  $('#mTitle').textContent=title; $('#mBody').innerHTML=body;
  const f=$('#mFoot'); f.innerHTML='';
  $('#mX').onclick=closeModal;
  (buttons||[{t:'Tutup',cls:'sec'}]).forEach(b=>{
    const el=document.createElement('button'); el.className='btn '+(b.cls||''); el.textContent=b.t;
    el.onclick=async()=>{
      if(b.fn){
        el.disabled=true;
        try{ const r=await b.fn(); if(r===false){ el.disabled=false; return; } }
        catch(e){ toast(e.message,'err'); el.disabled=false; return; }
      }
      closeModal();
    };
    f.appendChild(el);
  });
  $('#modal').classList.remove('hidden');
}
function closeModal(){ $('#modal').classList.add('hidden'); $('#mBody').innerHTML=''; }
function ask(msg, okText, cls){
  return new Promise(res=>{
    modal('Pengesahan', `<p>${msg}</p>`, [
      {t:'Batal',cls:'sec',fn:()=>{res(false);}},
      {t:okText||'Ya',cls:cls||'red',fn:()=>{res(true);}}
    ]);
    $('#mX').onclick=()=>{res(false);closeModal();};
  });
}

/* ---------- Tahap demerit ---------- */
function had(){ return {a:Math.max(1,+S.set.HadRingan||3), b:Math.max(1,+S.set.HadSederhana||3), c:Math.max(1,+S.set.HadBerat||1)}; }
const kitaranOn = () => S.set.SkopKiraan==='KITARAN';
/** Kedudukan dalam kitaran semasa (mod KITARAN: selepas Berat bermula semula pada Ringan) */
function posOf(n){ if(!kitaranOn()||n<=0) return n; const {a,b,c}=had(); return (n-1)%(a+b+c)+1; }
function kitOf(n){ if(!kitaranOn()||n<=0) return 1; const {a,b,c}=had(); return Math.floor((n-1)/(a+b+c))+1; }
function kitTag(n){ const k=kitOf(+n||0); return k>1?` <span class="badge b-kit" title="Murid telah melalui ${k-1} kitaran penuh (Ringan → Sederhana → Berat) dan kini dalam kitaran ke-${k}">🔁 Kitaran ${k}</span>`:''; }
function terdTag(r){ return r&&+r.Terdahulu?`<div><span class="badge b-lama" title="Rekod tahun ${esc(r.TahunTerdahulu||'')} ada di menu Arkib">📚 ${esc(r.Terdahulu)} rekod terdahulu (${esc(r.TahunTerdahulu||'')})</span></div>`:''; }
/** Pecahan kiraan c mengikut tahap dalam kitaran semasa */
function brk(c){ const {a,b}=had(), p=posOf(c); return {p, k:kitOf(c), r:Math.min(p,a), s:Math.max(0,Math.min(p-a,b)), br:Math.max(0,p-a-b)}; }
function tahapOf(n){ const {a,b}=had(); if(n<=0) return ''; n=posOf(n); return n<=a?'Ringan':(n<=a+b?'Sederhana':'Berat'); }
function sumberOpts(cur,first){ const L=(S.set.SumberKesalahan||[]).slice(); if(cur&&!L.includes(cur)) L.push(cur); return (first!==undefined?`<option value="">${esc(first)}</option>`:'')+L.map(x=>`<option ${x===cur?'selected':''}>${esc(x)}</option>`).join(''); }
function stBadge(st){ return st==='MENUNGGU'?'<span class="badge b-MENUNGGU">⏳ Menunggu</span>':st==='DITOLAK'?'<span class="badge b-DITOLAK">✕ Ditolak</span>':''; }
function badge(t){ return t?`<span class="badge b-${esc(t)}">${esc(t)}</span>`:'<span class="badge b-none">Tiada</span>'; }
function sBadge(st){ return `<span class="badge b-${esc(st)}">${esc(STATUS[st]||st)}</span>`; }
function lvlBar(n0){
  const {a,b,c}=had(), n=posOf(n0), K=kitOf(n0); let h='<div class="lvl">';
  for(let i=0;i<a;i++) h+=`<span style="${i<n?'background:var(--ringan)':''}"></span>`;
  for(let i=0;i<b;i++) h+=`<span style="${a+i<n?'background:var(--sederhana)':''}"></span>`;
  if(kitaranOn()) for(let i=0;i<c;i++) h+=`<span style="${a+b+i<n?'background:var(--berat)':''}"></span>`;
  else h+=`<span style="flex:1.6;${n>a+b?'background:var(--berat)':''}"></span>`;
  h+='</div>';
  return h+`<div class="muted">${kitaranOn()?`Kitaran ke-${K} · `:''}Ringan ${Math.min(n,a)}/${a} · Sederhana ${Math.max(0,Math.min(n-a,b))}/${b} · Berat ${Math.max(0,n-a-b)}${kitaranOn()?'/'+c:''}</div>`;
}
function skopText(){ return kitaranOn() ? 'secara berterusan sehingga murid tamat persekolahan (tidak bermula semula setiap tahun); selepas mencapai tahap Berat, kitaran baharu bermula semula pada tahap Ringan' : S.set.SkopKiraan==='SEMUA' ? 'secara terkumpul (keseluruhan)' : 'bagi setiap tahun kalendar (bermula semula setiap Januari)'; }

function setLoginBg(data, overlay){
  const o=Math.max(0,Math.min(90,+overlay||0))/100;

function enqueue(data){ const q=qGet(); q.push({cid:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),data,t:Date.now(),u:S.user&&S.user.ID,lat:!!S.latihan}); qSet(q); }
function renderOffBar(){
  const n=qGet().length, el=$('#offBar'); if(!el) return;
  if(!n && !S.offline){ el.classList.add('hidden'); return; }
  el.innerHTML = (S.offline?'📴 Luar talian — data mungkin tidak terkini. ':'')+(n?`⏳ <b>${n}</b> rekod disimpan dalam peranti, belum dihantar.`:'')+(n?' <button id="qGo">Hantar sekarang</button>':'');
  el.classList.remove('hidden'); if($('#qGo')) $('#qGo').onclick=()=>flushQueue(true);
}
let flushing=false;
async function flushQueue(manual){
  if(flushing||!S.token) return; const q=qGet(); if(!q.length){ renderOffBar(); return; }
  flushing=true; let ok=0;
  try{
    for(const it of q.slice()){
      if(it.u && S.user && it.u!==S.user.ID) continue;
      const prev=S.latihan; S.latihan=it.lat;
      try{ await api('recordOffence',Object.assign({},it.data,{clientId:it.cid})); ok++; qSet(qGet().filter(x=>x.cid!==it.cid)); }
      catch(e){ if(e.offline) break; toast('Rekod luar talian gagal dihantar: '+e.message,'err'); qSet(qGet().filter(x=>x.cid!==it.cid)); }
      finally{ S.latihan=prev; }
    }
  }finally{ flushing=false; }
  if(ok){ S.offline=false; toast(`${ok} rekod luar talian berjaya dihantar.`,'ok'); renderOffBar(); }
  else if(manual && qGet().length) toast('Masih tiada sambungan ke pelayan.','err');
}

/* ---------- Imbas kod QR / kod bar kad murid ---------- */
const JSQR_URL='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
const QRGEN_URL='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
function muridFromCode(txt){
  const t=String(txt||'').trim(); if(!t) return null;
  const cands=[t, t.split(/[:|;,\s\/=]+/).pop(), t.replace(/^\D+/,'')];
  for(const c of cands){ const m=S.murid.find(x=>x.NoDaftar.toLowerCase()===String(c).toLowerCase()); if(m) return m; }
  return null;
}
async function scanKad(onPick){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return toast('Kamera tidak disokong oleh pelayar ini.','err');
  let det=null;
  try{ if('BarcodeDetector' in window){ const f=await BarcodeDetector.getSupportedFormats(); if(f.length) det=new BarcodeDetector({formats:f.filter(x=>['qr_code','code_128','code_39','ean_13','ean_8','codabar','itf','upc_a','data_matrix'].includes(x))}); } }catch(e){ det=null; }
  if(!det){ try{ await loadJS(JSQR_URL,()=>window.jsQR,'pengimbas QR'); }catch(e){ return toast(e.message,'err'); } }
  let stream=null, stop=false, last='', lastT=0, n=0;
  modal('📷 Imbas Kad Murid',`<div style="position:relative;border-radius:12px;overflow:hidden;background:#000"><video id="qV" playsinline muted style="width:100%;display:block;max-height:60vh;object-fit:cover"></video>
      <div style="position:absolute;inset:18% 18%;border:3px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.25)"></div></div>
    <div id="qMsg" class="muted" style="margin-top:8px">Halakan kamera ke kod QR / kod bar pada kad murid. Boleh imbas beberapa kad berturut-turut.</div>
    <div id="qList" class="chips" style="margin-top:6px"></div>
    ${det?'':'<div class="muted" style="margin-top:4px">Pelayar ini hanya menyokong kod QR.</div>'}`,[{t:'Selesai',cls:'sec'}]);
  const end=()=>{ stop=true; if(stream) stream.getTracks().forEach(t=>t.stop()); };
  const obs=new MutationObserver(()=>{ if($('#modal').classList.contains('hidden')||!$('#qV')){ end(); obs.disconnect(); } });
  obs.observe($('#modal'),{attributes:true,childList:true,subtree:true});
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false}); }
  catch(e){ end(); $('#qMsg').innerHTML='<span class="err">Kamera tidak dapat dibuka. Benarkan akses kamera untuk laman ini.</span>'; return; }
  const v=$('#qV'); if(!v){ end(); return; } v.srcObject=stream; await v.play().catch(()=>{});
  const cv=document.createElement('canvas'), cx=cv.getContext('2d',{willReadFrequently:true});
  const hit=txt=>{
    const now=Date.now(); if(txt===last&&now-lastT<2500) return; last=txt; lastT=now;
    const m=muridFromCode(txt);
    if(navigator.vibrate) navigator.vibrate(m?60:[40,60,40]);
    if(!m){ $('#qMsg').innerHTML=`<span class="err">Kod "${esc(txt.slice(0,40))}" tidak sepadan dengan mana-mana murid aktif.</span>`; return; }
    onPick(m.NoDaftar); n++;
    $('#qMsg').innerHTML=`✅ <b>${esc(m.NamaPenuh)}</b> · ${esc(m.Kelas)} ditambah (${n} murid diimbas).`;
    $('#qList').insertAdjacentHTML('beforeend',`<span class="chip" style="padding:4px 10px">${esc(m.NamaPenuh.split(' ').slice(0,2).join(' '))}</span>`);
  };
  const tick=async()=>{
    if(stop) return;
    try{
      if(v.readyState>=2){
        if(det){ const r=await det.detect(v); if(r.length) hit(r[0].rawValue); }
        else { cv.width=v.videoWidth; cv.height=v.videoHeight; cx.drawImage(v,0,0); const im=cx.getImageData(0,0,cv.width,cv.height); const r=window.jsQR(im.data,im.width,im.height,{inversionAttempts:'dontInvert'}); if(r&&r.data) hit(r.data); }
      }
    }catch(e){}
    setTimeout(tick,det?120:220);
  };
  tick();
}
/** Cetak kad / pelekat QR murid (No. Pendaftaran) */
async function printKadQR(list){
  if(!list.length) return toast('Tiada murid untuk dicetak.','err');
  try{ await loadJS(QRGEN_URL,()=>window.qrcode,'penjana QR'); }catch(e){ return toast(e.message,'err'); }
  const svg=t=>{ const q=window.qrcode(0,'M'); q.addData(String(t)); q.make(); return q.createSvgTag({cellSize:3,margin:0,scalable:true}); };
  printDoc(`<style>.qr-g{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm}.qr-c{border:1px dashed #94a3b8;border-radius:3mm;padding:3mm;display:flex;gap:3mm;align-items:center;break-inside:avoid;page-break-inside:avoid}
    .qr-c svg{width:24mm;height:24mm;flex:0 0 24mm}.qr-c b{font-size:9pt;display:block;line-height:1.2}.qr-c small{font-size:8pt;color:#334155}</style>
    <div style="font-size:9pt;margin-bottom:3mm"><b>${esc(S.set.NamaSekolah||'')}</b> · Kad QR Murid (${list.length}) — gunting mengikut garisan dan lekatkan pada kad / buku murid.</div>
    <div class="qr-g">${list.map(m=>`<div class="qr-c">${svg(m.NoDaftar)}<div><b>${esc(m.NamaPenuh)}</b><small>${esc(m.Kelas)}<br>No. Daftar: ${esc(m.NoDaftar)}</small></div></div>`).join('')}</div>`, true);
}

  list.sort((x,y)=>kelasSort(x.Kelas,y.Kelas)||x.NamaPenuh.localeCompare(y.NamaPenuh));

function togglePick(no){

async function refreshCounts(list){
  if(!list.length) return;

  try{
    const r=await api('studentStatus',{noDaftarList:list,tarikh:$('#rTarikh')?$('#rTarikh').value:today()});
    Object.keys(r).forEach(no=>{ const p=S.pick.find(x=>x.NoDaftar===no); if(p){ p.count=r[no].count; p.terdahulu=r[no].terdahulu||0; p.tahunTerdahulu=(r[no].tahunTerdahulu||[]).join(', '); } });
    renderChips();
  }catch(e){ toast(e.message,'err'); }

  el.querySelectorAll('button[data-no]').forEach(b=>b.onclick=()=>togglePick(b.dataset.no));

function addRecent(nos){ let l=[]; try{ l=JSON.parse(LS.get(recentKey())||'[]'); }catch(e){} l=nos.concat(l.filter(x=>!nos.includes(x))).slice(0,8); LS.set(recentKey(),JSON.stringify(l)); }
async function saveRekod(force){
  if(!S.pick.length) return toast('Sila pilih sekurang-kurangnya seorang murid.','err');
  const kid=selectedKesID();
  if(!kid) return toast('Sila pilih kesalahan dan butirannya.','err');
  const sumber=$('#rSumber').value;
  if(!sumber) return toast('Sila pilih sumber kesalahan.','err');
  LS.set('dm_sumber_'+S.user.ID,sumber);
  if(!force){ const w=cutiWarn($('#rTarikh').value); if(w && !await ask(`📅 ${esc(w)}.<br>Adakah tarikh kejadian ini betul?`,'Ya, teruskan','amb')) return; }
  const btn=$('#rSave'); btn.disabled=true;
  try{
    const payload={noDaftarList:S.pick.map(p=>p.NoDaftar),kesalahanID:kid,sumber,tarikh:$('#rTarikh').value,masa:$('#rMasa').value,catatan:$('#rCat').value};
    if(force) payload.abaikanPendua=true;
    let res;
    try{ res=await api('recordOffence',payload); }
    catch(e){
      if(!e.offline) throw e;
      enqueue(payload); addRecent(payload.noDaftarList);
      toast(`📴 Luar talian: ${payload.noDaftarList.length} rekod disimpan dalam peranti dan akan dihantar secara automatik.`,'ok');

function bindRecActions(root, list, after){
  root.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!await ask('Padam rekod ini? Tindakan ini tidak boleh dibatalkan.<br><span class="muted">Nombor "kesalahan ke-" dan tahap bagi rekod lain murid ini akan dikira semula secara automatik.</span>','Padam')) return;
    try{ await api('deleteRecord',{ID:b.dataset.del}); toast('Rekod dipadam dan kiraan dikemas kini.','ok'); after(); }catch(e){ toast(e.message,'err'); }
  });
  root.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>editRecord(list.find(r=>r.ID===b.dataset.ed), after));
  root.querySelectorAll('[data-hist]').forEach(b=>b.onclick=()=>showHistory(b.dataset.hist));
}

function prevMonth(m){ let [y,mo]=m.split('-').map(Number); mo--; if(!mo){ mo=12; y--; } return y+'-'+String(mo).padStart(2,'0'); }
function monthRange(m){ const [yy,mm]=m.split('-').map(Number); return {dari:m+'-01',hingga:m+'-'+String(new Date(yy,mm,0).getDate()).padStart(2,'0'),label:BULAN_PENUH[mm-1]+' '+yy}; }
function addDays(d,n){ const x=new Date(d+'T00:00:00'); x.setDate(x.getDate()+n); return new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)+1; }
function delta(a,b){ if(!b&&!a) return '<span class="muted">—</span>'; if(!b) return '<span class="cmp-up">baharu</span>'; const p=Math.round((a-b)/b*100); return p>0?`<span class="cmp-up">▲ ${p}%</span>`:p<0?`<span class="cmp-dn">▼ ${-p}%</span>`:'<span class="muted">0%</span>'; }
function mergeLists(la,lb){ const m={}; la.forEach(x=>m[x.label]={label:x.label,a:x.bil,b:0}); lb.forEach(x=>{ (m[x.label]=m[x.label]||{label:x.label,a:0,b:0}).b=x.bil; }); return Object.values(m).sort((x,y)=>y.a-x.a||y.b-x.b); }

function rptRange(){
  const j=$('#lJ').value;
  if(j==='BULAN'){ const m=$('#lB').value||today().slice(0,7); const [yy,mm]=m.split('-').map(Number);
    const last=new Date(yy,mm,0).getDate(); return {dari:m+'-01',hingga:m+'-'+String(last).padStart(2,'0'),tajuk:'Laporan Bulanan: '+BULAN_PENUH[mm-1]+' '+yy}; }
  if(j==='TAHUN'){ const yy=$('#lT').value; return {dari:yy+'-01-01',hingga:yy+'-12-31',tajuk:'Laporan Tahunan '+yy}; }
  if(j==='BANDING'){ const m=monthRange($('#lCA').value||today().slice(0,7)); return {dari:m.dari,hingga:m.hingga,tajuk:'Laporan Bulanan: '+m.label}; }
  return {dari:$('#lDari').value,hingga:$('#lHingga').value,tajuk:'Laporan '+fmtD($('#lDari').value)+' hingga '+fmtD($('#lHingga').value)};
}
function heatmap(d){
  const hs=d.ikutJam.map(x=>x.jam), days=[1,2,3,4,5].concat([0,6].filter(i=>hs.some(h=>d.hariJam[i+'|'+h])));
  const nm=['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'];
  const max=Math.max(1,...Object.values(d.hariJam||{}));
  return `<table class="heat"><thead><tr><th></th>${hs.map(h=>`<th>${String(h).padStart(2,'0')}</th>`).join('')}</tr></thead><tbody>
    ${days.map(i=>`<tr><th style="text-align:left">${nm[i]}</th>${hs.map(h=>{ const v=d.hariJam[i+'|'+h]||0, a=v?0.12+0.78*v/max:0;
      return `<td style="background:rgba(227,34,43,${a.toFixed(2)});color:${a>.5?'#fff':'inherit'}">${v||''}</td>`; }).join('')}</tr>`).join('')}</tbody></table>`;
}
function vchart(list, daily){
  if(!list.length) return '<div class="muted">Tiada data.</div>';
  const max=Math.max(...list.map(x=>x.bil))||1;
  const lbl=x=>daily==='jam'? x.label.slice(0,2) : daily? String(+x.label.slice(8,10)) : BULAN[+x.label.slice(5,7)-1]+(list.length>12?' '+x.label.slice(2,4):'');
  const step=Math.ceil(list.length/16);
  return `<div class="vchart">${list.map(x=>`<div title="${esc(x.label)}: ${x.bil}"><b>${x.bil||''}</b><i style="height:${(x.bil/max*100).toFixed(1)}%"></i></div>`).join('')}</div>
    <div class="vlabels">${list.map((x,i)=>`<span>${i%step===0?lbl(x):''}</span>`).join('')}</div>`;
}

async function exportReport(){
  const d=S.rpt; if(!d) return;
  try{ await needXLSX(); }catch(e){ return toast(e.message,'err'); }
  const wb=XLSX.utils.book_new();
  const ring=XLSX.utils.aoa_to_sheet([[d.sekolah],[d.tajuk],['Tempoh',fmtD(d.dari)+' – '+fmtD(d.hingga)],[],
    ['Jumlah kesalahan',d.jumlah],['Murid terlibat',d.muridUnik],['Ringan',d.tahap.Ringan],['Sederhana',d.tahap.Sederhana],['Berat',d.tahap.Berat],[],
    ['Tindakan: Belum',d.tindakan.BELUM],['Tindakan: Dalam proses',d.tindakan.PROSES],['Tindakan: Selesai',d.tindakan.SELESAI]]);
  ring['!cols']=[{wch:26},{wch:30}];
  XLSX.utils.book_append_sheet(wb,ring,'Ringkasan');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.ikutKelas.map(k=>({'Kelas':k.label,'Murid terlibat':k.bilMurid,'Ringan':k.Ringan,'Sederhana':k.Sederhana,'Berat':k.Berat,'Jumlah':k.bil}))),'Ikut Kelas');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.ikutKesalahan.map(k=>({'Kesalahan':k.label,'Bilangan':k.bil}))),'Ikut Kesalahan');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet((d.ikutSumber||[]).map(k=>({'Sumber':k.label,'Bilangan':k.bil}))),'Ikut Sumber');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.topMurid.map((m,i)=>({'#':i+1,'No. Pendaftaran':m.NoDaftar,'Nama':m.NamaPenuh,'Kelas':m.Kelas,'Bilangan':m.bil,'Tahap terkini':m.tahap}))),'Murid Kerap');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet((d.ikutJenisTindakan||[]).map(k=>({'Jenis tindakan':k.label,'Bilangan':k.bil})).concat((d.ikutJenisTindakan||[]).length?[]:[{'Jenis tindakan':'(tiada)','Bilangan':0}])),'Jenis Tindakan');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.trend.map(t=>({'Tempoh':d.trendHarian?fmtD(t.label):t.label,'Bilangan':t.bil}))),'Trend');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet((d.ikutTingkatan||[]).map(k=>({'Tingkatan':k.label,'Murid terlibat':k.murid,'Ringan':k.Ringan,'Sederhana':k.Sederhana,'Berat':k.Berat,'Jumlah':k.bil}))),'Ikut Tingkatan');
  if(d.ikutKitaran) XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.ikutKitaran.map(k=>({'Kitaran':k.label,'Bilangan murid':k.bil}))),'Ikut Kitaran');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet((d.pengawas||[]).map(p=>({'Pengawas':p.nama,'Jawatan':p.jawatan,'Dihantar':p.dihantar,'Disahkan':p.sah,'Menunggu':p.menunggu,'Ditolak':p.ditolak,'Kadar ditolak (%)':p.kadarTolak,'Murid':p.murid,'Sumber utama':p.sumberUtama})).concat((d.pengawas||[]).length?[]:[{'Pengawas':'(tiada)'}])),'Prestasi Pengawas');
  XLSX.writeFile(wb,`Laporan_Demerit_${d.dari}_${d.hingga}.xlsx`);
}

function resizeImage(file,max,type,q){
  return new Promise((ok,ko)=>{
    const rd=new FileReader();
    rd.onerror=()=>ko(new Error('Gagal membaca fail imej.'));
    rd.onload=()=>{
      const img=new Image();
      img.onerror=()=>ko(new Error('Fail bukan imej yang sah.'));
      img.onload=()=>{
        const sc=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        ok(c.toDataURL(type||'image/png',q));
      };
      img.src=rd.result;
    };
    rd.readAsDataURL(file);
  });
}

function guessNext(k){
  const m=String(k).match(/^(\s*)(\d+)(.*)$/);
  if(!m) return '';
  const n=+m[2]; if(n>=5) return '__TAMAT__';
  return m[1]+(n+1)+m[3];
}

  ]);

function pickFile(handler){
  const fi=$('#fileIn'); fi.value='';
  fi.onchange=()=>{ const f=fi.files[0]; if(f) handler(f); };
  fi.click();
}
async function readSheet(file){
  await needXLSX();
  const wb=XLSX.read(await file.arrayBuffer());
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
}
function mapCols(aoa,defs){
  for(let i=0;i<Math.min(aoa.length,10);i++){
    const row=aoa[i].map(c=>String(c).toLowerCase().trim()); const idx={};
    Object.keys(defs).forEach(k=>{ idx[k]=row.findIndex(c=>defs[k].some(w=>c.includes(w))); });
    if(Object.values(idx).every(x=>x>=0)) return {start:i+1,idx};
  }
  return null;
}
async function importMuridFile(file){
  try{
    const aoa=await readSheet(file);
    const mp=mapCols(aoa,{no:['daftar'],nama:['nama'],kelas:['kelas']});
    if(!mp) throw new Error('Tajuk lajur tidak dijumpai. Gunakan templat: "No. Pendaftaran Murid", "Nama Penuh", "Kelas".');
    const rows=[];
    for(let i=mp.start;i<aoa.length;i++){
      const r=aoa[i]; const o={NoDaftar:String(r[mp.idx.no]||'').trim(),NamaPenuh:String(r[mp.idx.nama]||'').trim(),Kelas:String(r[mp.idx.kelas]||'').trim(),baris:i+1};
      if(o.NoDaftar||o.NamaPenuh||o.Kelas) rows.push(o);
    }
    if(!rows.length) throw new Error('Tiada data murid dalam fail.');
    const sah=rows.filter(r=>r.NoDaftar&&r.NamaPenuh&&r.Kelas).length;
    const ada=new Set(S.murid.map(m=>m.NoDaftar));
    const baru=rows.filter(r=>r.NoDaftar&&r.NamaPenuh&&r.Kelas&&!ada.has(r.NoDaftar)).length;
    modal('Import Senarai Murid',`
      <p><b>${rows.length}</b> baris dibaca daripada <i>${esc(file.name)}</i> · <b>${sah}</b> lengkap · ${rows.length-sah} tidak lengkap (akan diabaikan).</p>
      <div class="tw" style="max-height:220px"><table class="tbl"><thead><tr><th>No.</th><th>Nama</th><th>Kelas</th></tr></thead><tbody>
      ${rows.slice(0,15).map(r=>`<tr><td>${esc(r.NoDaftar)}</td><td>${esc(r.NamaPenuh)}</td><td>${esc(r.Kelas)}</td></tr>`).join('')}
      ${rows.length>15?`<tr><td colspan="3" class="muted">…dan ${rows.length-15} lagi</td></tr>`:''}</tbody></table></div>
      <label>Kaedah import</label>
      <select id="iMode"><option value="TAMBAH">Tambah & kemas kini (${baru} murid baharu, ${Math.max(0,sah-baru)} dikemas kini)</option>
      <option value="GANTI">Ganti keseluruhan senarai murid aktif</option></select>
      <div class="info warn" style="margin-top:10px">"Ganti keseluruhan" akan membuang semua murid aktif yang tiada dalam fail ini. Rekod kesalahan tidak terjejas.</div>`,[
      {t:'Batal',cls:'sec'},
      {t:'Import',cls:'grn',fn:async()=>{
        const r=await api('importMurid',{rows,mode:$('#iMode').value});
        S.murid=r.murid; S.kelas=r.kelas; S.muridArkib=r.muridArkib||S.muridArkib;
        toast(`Import selesai: ${r.tambah} baharu, ${r.kemaskini} dikemas kini.`,'ok');
        tMurid();
        if(r.ralat.length) setTimeout(()=>modal('Catatan Import',`<p>${r.ralat.length} catatan:</p><div style="max-height:300px;overflow:auto" class="muted">${r.ralat.map(esc).join('<br>')}</div>`),50);
      }}
    ]);
  }catch(e){ toast(e.message,'err'); }
}

      :'Tandakan kebenaran bagi setiap jawatan pengawas. Tanpa <b>Melihat semua rekod</b>, pengawas hanya melihat rekod yang dimasukkan sendiri. Tanpa <b>Rekod terus dikira</b>, rekod pengawas perlu disahkan guru dahulu. Pengawas tanpa jawatan mengikut tetapan di tab <b>Umum & Logo</b>.'}</div>
    <div class="toolbar"><span class="muted" style="align-self:center">Pratetap:</span>${PRE[p].map(x=>`<button class="btn sm sec" data-pre="${p}|${x[0]}">${esc(x[1])}</button>`).join('')}</div>
    <div class="tw"><table class="tbl"><thead><tr><th>Jawatan</th>${PL[p].map(x=>`<th style="text-align:center">${esc(x[1])}</th>`).join('')}</tr></thead><tbody id="jPerm_${p}"></tbody></table></div>
    <div class="muted" style="margin-top:6px">Klik nama jawatan untuk memilih baris itu sebelum menggunakan pratetap.</div>
  </div>`).join('')}
  <div style="text-align:right"><button class="btn" id="jSave">💾 Simpan Jawatan & Kebenaran</button></div>`;
  const sel={GURU:-1,PENGAWAS:-1};
  const drawPerm=p=>{
    const P=PL[p], tb=$('#jPerm_'+p); if(!tb) return;
    tb.innerHTML=L[p].map((j,i)=>`<tr style="${i===sel[p]?'background:rgba(42,91,215,.1)':''}"><td><a href="#" data-sr="${i}">${esc(j.Nama||'(tanpa nama)')}</a></td>${P.map(x=>`<td style="text-align:center"><input type="checkbox" data-pi="${i}" data-pk="${x[0]}" ${(j.Kebenaran||[]).includes(x[0])?'checked':''}></td>`).join('')}</tr>`).join('')||`<tr><td colspan="${P.length+1}" class="muted">Tiada jawatan.</td></tr>`;
    tb.querySelectorAll('input').forEach(c=>c.onchange=()=>{ const j=L[p][+c.dataset.pi]; const st=new Set(j.Kebenaran||[]); c.checked?st.add(c.dataset.pk):st.delete(c.dataset.pk); j.Kebenaran=P.map(x=>x[0]).filter(k=>st.has(k)); });
    tb.querySelectorAll('[data-sr]').forEach(a=>a.onclick=e=>{ e.preventDefault(); sel[p]=+a.dataset.sr; drawPerm(p); });
  };
  $('#tBody').querySelectorAll('[data-pre]').forEach(b=>b.onclick=()=>{
    const [p,k]=b.dataset.pre.split('|');
    if(sel[p]<0) return toast('Klik nama jawatan dalam jadual kebenaran dahulu.','err');
    L[p][sel[p]].Kebenaran=PRE[p].find(x=>x[0]===k)[2].slice(); drawPerm(p);
  });
  const draw=p=>{
    setTimeout(()=>drawPerm(p));
    $('#j_'+p).innerHTML=L[p].map((j,i)=>`<tr><td>${i+1}</td><td><input data-p="${p}" data-i="${i}" value="${esc(j.Nama)}"></td><td class="right">${j.ID?used(p,j.Nama):0}</td>
      <td class="nowrap right"><button class="btn sm sec" data-up="${p}|${i}" ${i?'':'disabled'}>↑</button> <button class="btn sm sec" data-dn="${p}|${i}" ${i<L[p].length-1?'':'disabled'}>↓</button> <button class="btn sm red" data-x="${p}|${i}">✕</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted">Tiada jawatan.</td></tr>';
    $('#j_'+p).querySelectorAll('input').forEach(el=>el.oninput=()=>{ L[p][+el.dataset.i].Nama=el.value; drawPerm(p); });
    const mv=(k,d)=>{ const [pp,ii]=k.split('|'); const i=+ii, t=L[pp][i]; L[pp].splice(i,1); L[pp].splice(i+d,0,t); sel[pp]=-1; draw(pp); };
    $('#j_'+p).querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>mv(b.dataset.up,-1));
    $('#j_'+p).querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>mv(b.dataset.dn,1));
    $('#j_'+p).querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{ const [pp,ii]=b.dataset.x.split('|'); const j=L[pp][+ii];
      if(j.ID&&used(pp,j.Nama)) return toast(`Jawatan "${j.Nama}" masih digunakan oleh ${used(pp,j.Nama)} pengguna. Tukar jawatan pengguna dahulu.`,'err');
      L[pp].splice(+ii,1); sel[pp]=-1; draw(pp); });
  };
  draw('GURU'); draw('PENGAWAS');
  $('#tBody').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{ const p=b.dataset.add; L[p].push({ID:'',Nama:'',Peranan:p,Kebenaran:p==='GURU'?PERMS.map(x=>x[0]):defP()}); draw(p); const ins=$('#j_'+p).querySelectorAll('input'); ins[ins.length-1].focus(); });
  $('#jSave').onclick=async()=>{
    try{ const r=await api('saveJawatan',L); S.jawatan=r.jawatan; S.users=r.users; toast('Jawatan dan kebenaran disimpan. Pengguna akan menerima kebenaran baharu apabila halaman dimuat semula.','ok'); tJawatan(); }
    catch(e){ toast(e.message,'err'); }
  };
}

/* ---------- Jenis tindakan ---------- */
function tListEditor(key,title,info,label,after,flag){
  const L=(S.set[key]||[]).slice();
  const F=flag?L.map(x=>(S.set[flag.key]||[]).includes(x)):[];   // tanda bagi setiap item (cth. perlu pengesahan)
  $('#tBody').innerHTML=`<div class="card" style="max-width:${flag?860:720}px"><h3>${title}</h3>
    <div class="info" style="margin-bottom:12px">${info}</div>
    <div class="tw"><table class="tbl"><thead><tr><th>#</th><th>${esc(label)}</th>${flag?`<th style="text-align:center">${esc(flag.label)}</th>`:''}<th></th></tr></thead><tbody id="jtB"></tbody></table></div>
    <div class="toolbar" style="margin-top:10px;justify-content:space-between"><button class="btn sec" id="jtAdd">+ Tambah</button><button class="btn" id="jtSave">💾 Simpan</button></div></div>`;
  const draw=()=>{
    $('#jtB').innerHTML=L.map((j,i)=>`<tr><td>${i+1}</td><td><input data-i="${i}" value="${esc(j)}" maxlength="80"></td>${flag?`<td style="text-align:center;white-space:nowrap"><label style="display:inline-flex;gap:6px;align-items:center;margin:0;font-weight:600;cursor:pointer"><input type="checkbox" data-f="${i}" ${F[i]?'checked':''} style="width:auto"> ${F[i]?'<span class="badge b-MENUNGGU">Perlu disahkan</span>':'<span class="muted">Tidak perlu</span>'}</label></td>`:''}<td class="nowrap right"><button class="btn sm sec" data-m="${i}|-1" ${i?'':'disabled'}>↑</button> <button class="btn sm sec" data-m="${i}|1" ${i<L.length-1?'':'disabled'}>↓</button> <button class="btn sm red" data-x="${i}">✕</button></td></tr>`).join('');
    $('#jtB').querySelectorAll('input[data-i]').forEach(el=>el.oninput=()=>{ L[+el.dataset.i]=el.value; });
    $('#jtB').querySelectorAll('input[data-f]').forEach(el=>el.onchange=()=>{ F[+el.dataset.f]=el.checked; draw(); });
    $('#jtB').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ const [i,d]=b.dataset.m.split('|').map(Number); const t=L[i]; L.splice(i,1); L.splice(i+d,0,t); if(flag){ const f=F[i]; F.splice(i,1); F.splice(i+d,0,f); } draw(); });
    $('#jtB').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{ L.splice(+b.dataset.x,1); if(flag) F.splice(+b.dataset.x,1); draw(); });
  };
  draw();
  $('#jtAdd').onclick=()=>{ L.push(''); if(flag) F.push(false); draw(); const ins=$('#jtB').querySelectorAll('input[data-i]'); ins[ins.length-1].focus(); };
  $('#jtSave').onclick=async()=>{ try{
    const o={[key]:JSON.stringify(L)};
    if(flag) o[flag.key]=JSON.stringify(L.map((x,i)=>F[i]?x.trim():'').filter(Boolean));
    const r=await api('saveSettings',o); S.set=r.settings; toast('Senarai disimpan.','ok'); after(); }catch(e){ toast(e.message,'err'); } };
}

  <div class="grid g2">${d.semak.map(x=>`<div class="stat ${cl[x.tahap]}" style="padding:16px"><div class="sp" style="align-items:flex-start"><b style="font-size:14.5px">${ic[x.tahap]} ${esc(x.tajuk)}</b>
    <span class="badge b-${x.tahap==='OK'?'Ringan':x.tahap==='AMARAN'?'Sederhana':'Berat'}">${x.tahap==='OK'?'OK':x.tahap==='AMARAN'?'Amaran':'Kritikal'}</span></div>
    <div class="muted" style="margin-top:6px">${esc(x.butiran)}</div>${x.cadangan?`<div style="margin-top:6px;font-size:13px">👉 ${esc(x.cadangan)}</div>`:''}</div>`).join('')}</div>

      ${d.helaian.map(h=>`<tr><td>${esc(h.nama)}</td><td class="right">${h.baris.toLocaleString()}</td><td class="right">${h.sel.toLocaleString()}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="card"><h3>ℹ️ Maklumat Sistem</h3>
      ${[['Versi frontend',vf+(String(vf).split('.')[0]!=String(vb)?' ⚠️ tidak sepadan dengan backend':'')],['Versi backend',vb],['Fail Google Sheet',d.info.fail],['Zon waktu',d.info.zon],['Masa pelayan',fmtD(d.info.masa)],
         ['Cache permintaan ini',`${d.info.cache.hit} dari cache · ${d.info.cache.miss} dari helaian`],['Pengguna berdaftar',d.info.pengguna],['Murid aktif',d.info.murid],
         ['Mod',S.latihan?'Latihan':'Sebenar'],['Rekod luar talian belum dihantar (peranti ini)',qGet().length]]
        .map(([k,v])=>`<div class="sp" style="padding:5px 0;border-bottom:1px solid var(--line)"><span class="muted">${esc(k)}</span><b style="text-align:right">${esc(v)}</b></div>`).join('')}
      <div style="margin-top:10px"><a class="btn sec sm" href="${esc(d.info.url)}" target="_blank" rel="noopener">📄 Buka Google Sheet</a></div>
    </div>
  </div>

   PENGESANAN VERSI BAHARU
   Bandingkan CSS + JS halaman semasa dengan index.html terkini di pelayan.
   ===================================================================== */
const UPD = {shown:false, dismissedAt:0, ver:''};
function hashStr(t){ let h=0x811c9dc5; for(let i=0;i<t.length;i++){ h^=t.charCodeAt(i); h=Math.imul(h,0x01000193); } return (h>>>0).toString(16); }
function partOf(html,tag,id){ const a='<'+tag+' id="'+id+'">', i=html.indexOf(a); if(i<0) return null; const j=html.indexOf('</'+tag+'>',i); return j<0?null:html.slice(i+a.length,j); }
const SIG_NOW = hashStr((($('#app-css')||{}).textContent||'')+'|'+(($('#app-js')||{}).textContent||''));
function showUpdate(ver){
  if(ver) UPD.ver=ver;
  if(UPD.dismissedAt && Date.now()-UPD.dismissedAt<30*60*1000) return;   // ditutup: tunjuk semula selepas 30 minit
  $('#updVer').textContent = UPD.ver && UPD.ver!==APP_VERSI ? ` (v${UPD.ver})` : '';
  $('#updBar').classList.remove('hidden'); UPD.shown=true;
}
async function checkUpdate(){
  if(IN_GAS || !/^https?:$/.test(location.protocol)) return;
  try{
    const r=await fetch('index.html?_v='+Date.now(),{cache:'no-store'});
    if(!r.ok) return;
    const t=await r.text(), css=partOf(t,'style','app-css'), js=partOf(t,'script','app-js');
    if(css==null||js==null) return;
    if(hashStr(css+'|'+js)!==SIG_NOW){ const m=t.match(/const APP_VERSI = '([^']+)'/); showUpdate(m?m[1]:''); }
  }catch(e){}
}
async function doRefresh(){
  const b=$('#updBtn'); b.disabled=true; b.textContent='Mengemas kini…';
  try{
    if('serviceWorker' in navigator){
      const reg=await navigator.serviceWorker.getRegistration();
      if(reg){ await reg.update().catch(()=>{}); if(reg.waiting) reg.waiting.postMessage('SKIP_WAITING'); }
    }
    if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
  }catch(e){}
  location.reload();
}
$('#updBtn').onclick=doRefresh;
$('#updX').onclick=()=>{ $('#updBar').classList.add('hidden'); UPD.dismissedAt=Date.now(); };
setTimeout(checkUpdate, 8000);                                   // semakan pertama
setInterval(checkUpdate, 10*60*1000);                            // setiap 10 minit
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkUpdate(); });

init();
</script>
